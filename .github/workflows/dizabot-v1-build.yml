name: Build DIZAbot V1

on:
  push:
    branches: ["dizabot-v1-clean-black"]
    paths:
      - "dizabot-v1/**"
      - ".github/workflows/dizabot-v1-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.9"

      - name: Android SDK
        run: |
          set -euxo pipefail
          SDKROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDKROOT" -type f -name sdkmanager | head -n1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$SDKROOT" > dizabot-v1/local.properties

      - name: Build debug APK
        run: |
          set -euxo pipefail
          gradle -p dizabot-v1 :app:assembleDebug --stacktrace

      - name: QC
        run: |
          set -euxo pipefail
          APK=dizabot-v1/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.dizabot.app'" /tmp/badging.txt
          cp "$APK" DIZAbot-v1.0.0-debug.apk
          sha256sum DIZAbot-v1.0.0-debug.apk | tee DIZAbot-v1.0.0-debug.apk.sha256
          ls -lh DIZAbot-v1.0.0-debug.apk

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DIZAbot-v1.0.0-debug-apk
          path: |
            DIZAbot-v1.0.0-debug.apk
            DIZAbot-v1.0.0-debug.apk.sha256
          retention-days: 14
