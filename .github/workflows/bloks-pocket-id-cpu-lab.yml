name: Bloks Pocket Indonesian cloned-voice CPU evaluation
on:
  push:
    branches: [bloks-call-fastcpu-lab-20261012]
    paths:
      - ".github/workflows/bloks-pocket-id-cpu-lab.yml"
      - "diza-live/fastcpu-lab/pocket_id_cpu.py"
  workflow_dispatch:
jobs:
  voice-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: CPU and ffmpeg
        run: |
          python -c 'import os; print("CPU count",os.cpu_count())'
          if ! command -v ffmpeg >/dev/null 2>&1; then sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg; fi
          ffmpeg -version | head -1
      - name: Install CPU-only PyTorch and Indonesian Pocket TTS
        run: |
          python -m pip install --quiet --index-url https://download.pytorch.org/whl/cpu "torch>=2.5,<3" "torchaudio>=2.5,<3"
          python -m pip install --quiet "pocket-tts==3.1.0" "huggingface-hub>=0.30,<1" "soundfile>=0.12"
      - name: Actual CPU synthesis using same approved F5 female reference
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          CUDA_VISIBLE_DEVICES: ""
          OMP_NUM_THREADS: "2"
        run: |
          python -u diza-live/fastcpu-lab/pocket_id_cpu.py
      - name: Share WAV samples and actual speed
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pocket-indonesian-f5-reference-cpu-comparison
          path: diza-live/fastcpu-lab/outputs-pocket/
          retention-days: 7
          if-no-files-found: error
