name: Evolution Lab isolated tests
on:
  push:
    branches:
      - experiment-evolution-lab
    paths:
      - 'experiments/evolution-lab/**'
      - '.github/workflows/evolution-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evolution-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify experimental lab only
        run: node --test experiments/evolution-lab/lab.test.mjs experiments/evolution-lab/evolution-lab-api.test.mjs
      - name: Validate JavaScript modules
        run: |
          node --check experiments/evolution-lab/lab.mjs
          node --check experiments/evolution-lab/evolution-lab-api.mjs
          node --check experiments/evolution-lab/patch-evolution-lab.mjs
      - name: Run deterministic demo (no API, no credentials, no deployment)
        run: node experiments/evolution-lab/lab.mjs demo
