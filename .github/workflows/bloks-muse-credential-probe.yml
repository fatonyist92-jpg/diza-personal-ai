name: Bloks Muse Credential Diagnostic Safety
on:
  push:
    branches: [bloks-muse-fresh-auth-probe-20261012]
    paths:
      - "diza-live/railway/muse-smoke.mjs"
      - "diza-live/railway/muse-acp-smoke.mjs"
      - ".github/workflows/bloks-muse-credential-probe.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Verify diagnostics cannot overwrite auth, key or user config
        run: |
          node --check diza-live/railway/muse-smoke.mjs
          node --check diza-live/railway/muse-acp-smoke.mjs
          grep -Fq 'PROBE_EPOCH' diza-live/railway/muse-smoke.mjs
          grep -Fq 'PROBE_EPOCH' diza-live/railway/muse-acp-smoke.mjs
          grep -Fq 'OPENCODE_ZEN_CREDENTIAL_REJECTED' diza-live/railway/muse-smoke.mjs
          grep -Fq 'OPENCODE_ZEN_CREDENTIAL_REJECTED' diza-live/railway/muse-acp-smoke.mjs
          ! grep -E '(unlinkSync|rmSync|rm\(|auth.json|clearAuth|sign.?out|logout)' diza-live/railway/muse-smoke.mjs diza-live/railway/muse-acp-smoke.mjs
          echo 'MUSE_SAFE_AUTH_DIAGNOSTIC=PASS'
