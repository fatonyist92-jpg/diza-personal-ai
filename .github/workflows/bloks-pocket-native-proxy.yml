name: Bloks Pocket native ONNX secure audio gateway (quick unit tests)
on:
  push:
    branches: [bloks-call-fastcpu-lab-20261012]
    paths:
      - "diza-live/pocket-native-lab/native-auth-proxy.mjs"
      - "diza-live/pocket-native-lab/native-auth-proxy.test.mjs"
      - ".github/workflows/bloks-pocket-native-proxy.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test native ONNX adapter and 32-bit to 16-bit WAV conversion
        run: |
          node --check diza-live/pocket-native-lab/native-auth-proxy.mjs
          node --test diza-live/pocket-native-lab/native-auth-proxy.test.mjs
