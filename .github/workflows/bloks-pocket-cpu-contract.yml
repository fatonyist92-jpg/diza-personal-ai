name: Bloks Pocket CPU voice - isolated API contract
on:
  push:
    branches: [bloks-call-fastcpu-lab-20261012]
    paths:
      - "diza-live/pocket-cpu/**"
      - ".github/workflows/bloks-pocket-cpu-contract.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install small testing dependencies (no model weights, no Railway deployment)
        run: python -m pip install --quiet "fastapi>=0.110,<1" "httpx>=0.27,<1" "numpy>=1.26,<3" "soundfile>=0.12,<1"
      - name: Worker compile and security/API regression test
        run: |
          python -m py_compile diza-live/pocket-cpu/pocket_service.py diza-live/pocket-cpu/test_pocket_service.py
          python diza-live/pocket-cpu/test_pocket_service.py -v
      - name: Verify files remain completely isolated from locked production
        run: |
          test -f diza-live/pocket-cpu/pocket_service.py
          test -f diza-live/railway/f5-remote-tts.mjs
          test -f diza-live/railway/web/pair.html
          echo "PASS: separate pocket-cpu lab, no production files patched or deployed"
