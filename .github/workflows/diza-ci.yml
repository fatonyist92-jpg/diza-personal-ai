name: DIZA branch check

on:
  push:
    branches:
      - bloks-diza-web
    paths-ignore:
      - ".github/workflows/import-bloks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bloks-diza-web
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - name: Build hosted DIZA container
        run: docker build -t diza-ai:test .
      - name: Verify Codex CLI is present
        run: docker run --rm --entrypoint codex diza-ai:test --version
      - name: Smoke-test hosted DIZA boundary
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name diza-smoke -p 18799:8799 \
            -e DIZA_WEB_PASSWORD='ci-only-password-2026' \
            diza-ai:test
          trap 'docker rm -f diza-smoke >/dev/null 2>&1 || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:18799/api/diza/session > /tmp/session.json; then
              break
            fi
            sleep 1
          done
          node -e '
            const fs=require("fs");
            const x=JSON.parse(fs.readFileSync("/tmp/session.json","utf8"));
            if (x.enabled !== true || x.authenticated !== false) {
              console.error(x);
              process.exit(1);
            }
          '
          code="$(curl -sS -o /tmp/bots.json -w '%{http_code}' http://127.0.0.1:18799/api/bots)"
          test "$code" = "401"

          # A localhost tunnel such as hostc connects from loopback and rewrites
          # Host/Origin to localhost. Hosted mode must still require DIZA login.
          loopback_code="$(docker exec diza-smoke sh -lc "curl -sS -o /tmp/bots-loopback.json -w '%{http_code}' http://127.0.0.1:8799/api/bots")"
          test "$loopback_code" = "401"

          curl -fsS -c /tmp/diza-cookie             -H 'Origin: http://127.0.0.1:18799'             -H 'Content-Type: application/json'             -d '{"password":"ci-only-password-2026"}'             http://127.0.0.1:18799/api/diza/login >/tmp/login.json

          curl -fsS -b /tmp/diza-cookie             -H 'Origin: http://127.0.0.1:18799'             http://127.0.0.1:18799/api/providers >/tmp/providers.json
          curl -fsS -b /tmp/diza-cookie             -H 'Origin: http://127.0.0.1:18799'             http://127.0.0.1:18799/api/instances >/tmp/instances.json

          node -e '
            const fs=require("fs");
            const providers=JSON.parse(fs.readFileSync("/tmp/providers.json","utf8")).providers;
            const instances=JSON.parse(fs.readFileSync("/tmp/instances.json","utf8")).instances;
            if (!Array.isArray(providers) || providers.length === 0) {
              console.error("provider catalog empty");
              process.exit(1);
            }
            if (!Array.isArray(instances) || instances.length === 0) {
              console.error("instance catalog empty");
              process.exit(1);
            }
            console.log("catalogs ok", {providers: providers.length, instances: instances.length});
          '

          docker logs diza-smoke
