name: Bloks Pocket Indonesian native ONNX CPU probe (isolated)
on:
  push:
    branches: [bloks-call-fastcpu-lab-20261012]
    paths:
      - "diza-live/pocket-native-lab/**"
      - ".github/workflows/bloks-pocket-native-onnx.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-onnx-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install HF download client and build tools
        run: |
          python -m pip install --quiet "huggingface_hub>=0.30,<1"
          command -v git
          command -v cmake
          command -v /usr/bin/time
      - name: Compile C++ ONNX native runtime, clone Indonesian voice, measure CPU RSS
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          OMP_NUM_THREADS: "2"
        run: bash diza-live/pocket-native-lab/probe_native.sh
      - name: Upload native WAV for human quality verification
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pocket-native-onnx-id-real-voice-sample
          path: diza-live/pocket-native-lab/outputs/pocket_native_santai.wav
          retention-days: 7
          if-no-files-found: error
