name: Build AVM Technical APK

on:
  push:
    branches: [ avm-technical-bot-offline ]
    paths:
      - "avmapp/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/avm-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build offline APK
        run: gradle :avmapp:assembleDebug --stacktrace

      - name: Prepare installable APK
        run: cp avmapp/build/outputs/apk/debug/avmapp-debug.apk AVM-Technical-Bot-v1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AVM-Technical-Bot-v1
          path: AVM-Technical-Bot-v1.apk
          retention-days: 30
