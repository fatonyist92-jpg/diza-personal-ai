name: Evolution Lab experimental Docker acceptance
# Gate 2: stable owner-route injection after pinned Bloks auth
on:
  push:
    branches:
      - experiment-evolution-lab
    paths:
      - '.github/workflows/evolution-lab-image.yml'
      - 'diza-live/railway/Dockerfile'
  workflow_dispatch:
concurrency:
  group: evolution-lab-image-acceptance
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  image-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build experimental Railway image (no deployment, no API keys)
        run: docker build --progress=plain --file diza-live/railway/Dockerfile --tag evolution-lab:acceptance .
      - name: Verify lab assets inside built image
        run: |
          docker run --rm --entrypoint sh evolution-lab:acceptance -c '
            test -s /opt/bloks/dist/evolution-lab/index.html &&
            test -s /opt/bloks/server/evolution-lab-api.mjs &&
            test -s /opt/bloks/dist/evolution-lab/client.js &&
            grep -q "api/evolution-lab" /opt/bloks/server/index.ts &&
            grep -q "Gemini API" /opt/bloks/dist/evolution-lab/index.html
          '
      - name: Start real pinned Bloks harness with disposable CI storage and smoke test HTTP
        run: |
          mkdir -p /tmp/evolution-lab-data
          docker run -d --name evolution-lab-smoke \
            -e RAILWAY_VOLUME_MOUNT_PATH=/home/node/.bloks \
            -v /tmp/evolution-lab-data:/home/node/.bloks \
            -p 127.0.0.1:18899:10000 \
            evolution-lab:acceptance
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:18899/api/health >/tmp/evolution-health; then break; fi
            sleep 2
          done
          cat /tmp/evolution-health
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18899/evolution-lab/index.html)" = "200"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18899/evolution-lab/client.js)" = "200"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18899/api/evolution-lab/status)" = "401"
      - name: Stop disposable CI harness
        if: always()
        run: docker rm --force evolution-lab-smoke || true
