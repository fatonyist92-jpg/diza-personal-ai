name: DIZA Live Stage 02 - native voice APK

on:
  push:
    branches:
      - diza-live-stage-02-voice
    paths:
      - "diza-live/stage-02/**"
      - ".github/workflows/diza-live-stage-02.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-voice:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify pure Java 10-turn voice state transitions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/diza-stage2-javac
          javac -d /tmp/diza-stage2-javac \
            diza-live/stage-02/android/app/src/main/java/app/diza/live/voice/VoiceCycle.java \
            diza-live/stage-02/tests/VoiceCycleTest.java
          java -cp /tmp/diza-stage2-javac VoiceCycleTest

      - name: Stage 01 API regression tests
        run: node --test diza-live/stage-01/core-bridge.test.mjs

      - name: Install SDK packages directly on GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Preserve prototype debug signing identity for later updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: diza-live-stage02-debug-keystore-v1

      - name: Compile new native Android APK
        working-directory: diza-live/stage-02/android
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Check generated APK integrity and signing
        shell: bash
        run: |
          set -euo pipefail
          APK="diza-live/stage-02/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" | tail -1
          unzip -l "$APK" | grep -F classes.dex
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK"
          mkdir -p artifact
          cp "$APK" artifact/DIZA-Live-Stage02-Voice-Prototype.apk

      - name: Upload actual Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DIZA-Live-Stage02-Voice-Prototype-APK
          path: artifact/DIZA-Live-Stage02-Voice-Prototype.apk
          if-no-files-found: error
          retention-days: 30
