name: Build Diza Bot Agent APK
on:
  push:
    branches:
      - diza-bot-agent
    paths:
      - 'diza-bot-agent-android/**'
      - '.github/workflows/diza-bot-agent-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
      - name: Install Android SDK
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build APK
        run: gradle -p diza-bot-agent-android :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: diza-bot-agent-v0.6-apk
          path: diza-bot-agent-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
