name: Build Diza Bot Agent APK
on:
  push:
    branches:
      - tmp-diza-bot-agent-apk-final
    paths:
      - 'diza-android/**'
      - '.github/workflows/tmp-diza-bot-agent-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Fetch Diza app icon
        run: |
          mkdir -p diza-android/app/src/main/res/drawable
          curl -fL --retry 3 "https://diza-bot-agent.floot.app/_cdn/static/2daabeef-aac9-4289-9026-12a342ed4eee-diza-bot-agent-icon.png" -o diza-android/app/src/main/res/drawable/diza_icon.png
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build APK
        run: gradle -p diza-android :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Diza-Bot-Agent-v0.5-APK
          path: diza-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
