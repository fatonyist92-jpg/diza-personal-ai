name: Bloks Indonesian ONNX size inspection (isolated)
on:
  push:
    branches: [bloks-call-fastcpu-lab-20261012]
    paths:
      - "diza-live/pocket-cpu/inspect_onnx.py"
      - ".github/workflows/bloks-pocket-onnx-inspect.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install metadata client (no model weights)
        run: python -m pip install --quiet "huggingface_hub>=0.30,<1"
      - name: Inspect exact ONNX INT8 files
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python -u diza-live/pocket-cpu/inspect_onnx.py
