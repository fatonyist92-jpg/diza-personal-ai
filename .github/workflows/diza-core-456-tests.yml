name: Diza Core 4-5-6 Tests
# revision: 3

on:
  push:
    branches:
      - diza-bot-agent-dev-123
    paths:
      - "diza-core-456/**"
      - ".github/workflows/diza-core-456-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run core tests
        working-directory: diza-core-456
        run: npm test
