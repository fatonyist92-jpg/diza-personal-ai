name: Build Diza APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Copy release APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Diza-v0.3.3.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Diza-v0.3.3-test-debug
          path: Diza-v0.3.3.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v0.3.3 --cleanup-tag --yes || true
          git tag -f v0.3.3
          git push origin -f v0.3.3
          gh release create v0.3.3 Diza-v0.3.3.apk \
            --title "Diza v0.3.3 Avatar Fix" \
            --notes "HD avatar is streamed directly from local app storage without recompress/base64 transfer. Test Mode remains local without OpenAI API."
