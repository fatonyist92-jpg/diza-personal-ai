name: Build Diza APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "app/**"
      - "avatar-engine/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore debug signing cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: diza-debug-keystore-v1

      - name: Fetch Diza v0.3.8 visual assets
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          mkdir -p app/src/main/res/raw

          curl --fail --location --retry 3 --retry-delay 2 \
            'https://uc02249a6a916a6c8602442663b9.dl.dropboxusercontent.com/cd/0/get/DIV8M0XKnrNhv5OR6YRv_GLzX5Zj_7qtQVSqyKUB8QXQo40VCXSdyN8jChhZ1quNqbf9sehJosjPhWSLhJ8TQ5rjEvOqnQPMhKHuIcXDGVUfLSmPBL1uX3IWPh3rkBbqxJlAvpQuPpndQYQoLYPY7bIrmZ3PGwyVy-iiLs9IB8DZGA/file?c_luid=41a51812' \
            --output app/src/main/res/drawable-nodpi/diza_avatar_default.png

          curl --fail --location --retry 3 --retry-delay 2 \
            'https://uc67f330c27467509e36009b9284.dl.dropboxusercontent.com/cd/0/get/DIXUtZS6nyFl2T2MVbfNY6cpNhOkArxXu9821dgVjRutIgMinlLsC_yMQr0qA-PGHTiwptKFQqMWFUaKg330s3R4mA4c8XxDz8zPwriu7erzjJ0nzKbcgWTGQw0JaejmhV9xB0_Lr133hAxScIPBm6N_YbTXLeGXCZUUDZ_1hMOkGg/file?c_luid=41a51812' \
            --output app/src/main/res/raw/diza_opening.mp4

          echo '2ca272ac6d2acf935038fe4d83536a2da844d117aebce058a04bc95ec8fcee16  app/src/main/res/drawable-nodpi/diza_avatar_default.png' | sha256sum -c -
          echo '9064d50d7335671d298cbc5431af9fc419190150a90fd8dc86e2b6e748665904  app/src/main/res/raw/diza_opening.mp4' | sha256sum -c -

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle :app:assembleDebug

      - name: Copy release APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Diza-v0.3.8.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Diza-v0.3.8
          path: Diza-v0.3.8.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v0.3.8 --cleanup-tag --yes || true
          git tag -f v0.3.8
          git push origin -f v0.3.8
          gh release create v0.3.8 Diza-v0.3.8.apk \
            --title "Diza v0.3.8" \
            --notes "Exact final video frame becomes the static avatar. Video and avatar keep the same full-screen viewport. Controls slide up as a bottom sheet. Transcript uses a professional glass card and stays audio-reactive."
