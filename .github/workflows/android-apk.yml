name: Build Diza APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "app/**"
      - "avatar-engine/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore debug signing cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: diza-debug-keystore-v1

      - name: Fetch bundled Diza avatar
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://ucf35748654de6f7e19b5595c9c0.dl.dropboxusercontent.com/cd/0/get/DIV3JH0AgVj1TFchObgZBU5Bs7S8qyb0No4vDIQs_GQyob2dpUI9cw82UBQyv-aCbK0K_WYH3NiOppQE3QGRsAr136ALCJ2Sw-lyy1pXuNODASph32PNATDZ-XDrq6fWO9W7faBQxHqFvUjPbqJBMyegh3upKQfWg7TNAe4lOwrvcA/file?c_luid=41a51812' \
            --output app/src/main/res/drawable-nodpi/diza_avatar_default.jpg
          echo 'de8189f05495cc290893fe9b748d970393932a8bf1f6233a0fedac07093dff47  app/src/main/res/drawable-nodpi/diza_avatar_default.jpg' | sha256sum -c -

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle :app:assembleDebug

      - name: Copy APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Diza-v0.3.5.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Diza-v0.3.5
          path: Diza-v0.3.5.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v0.3.5 --cleanup-tag --yes || true
          git tag -f v0.3.5
          git push origin -f v0.3.5
          gh release create v0.3.5 Diza-v0.3.5.apk \
            --title "Diza v0.3.5" \
            --notes "Avatar Diza otomatis saat app dibuka, tidak ada avatar picker, fake whole-photo motion dihapus, icon Diza baru, waveform Test Mode tetap aktif."
