name: Build Diza APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "app/**"
      - "avatar-engine/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore debug signing cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: diza-debug-keystore-v1

      - name: Fetch Diza visual assets
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          mkdir -p app/src/main/res/raw

          curl --fail --location --retry 3 --retry-delay 2 \
            'https://uc54fd20dfaaf91e6a75aa7d0713.dl.dropboxusercontent.com/cd/0/get/DIXUtifYcE3xuInz1IqYwMhQo3esVw8B7N6GEeaJu9ne1vO6EETBS-Sxn6fK9F9MUgnTZbpfVs7fl2bd4TC1U7Kg5kedrZthwB7ThFnYflxy5Zd0guLy82zV4-nH0VnAMf3pL0niWb4Tns9gwZ8Q_z8ES_lX3JdUqjNWMH4ODonWaA/file?c_luid=41a51812' \
            --output app/src/main/res/drawable-nodpi/diza_avatar_default.png

          curl --fail --location --retry 3 --retry-delay 2 \
            'https://uc6ef28c781b11bc4b55a05d0f9d.dl.dropboxusercontent.com/cd/0/get/DIUK3sRjChLuP5RY6CxSUGo729Pd0yQvOAd4lfmvEf0rz5TCk-Hx-DY3-Mbxt9ShMBkSV8_fmMFuu_WJwjGwdEFnjZ5THIKyjTvKmyYuhAHAecxY2OCRP05NRyviY3Kn4ArGVKeIg42kR-mVZ2ygKs-P49wELtzrhQQVf0bhx_WRxQ/file?c_luid=41a51812' \
            --output app/src/main/res/raw/diza_opening.mp4

          echo 'c614a927bc68b64c40862ada63139ad3fe3c7cc7b7312ff4f40372d20c674376  app/src/main/res/drawable-nodpi/diza_avatar_default.png' | sha256sum -c -
          echo '9064d50d7335671d298cbc5431af9fc419190150a90fd8dc86e2b6e748665904  app/src/main/res/raw/diza_opening.mp4' | sha256sum -c -

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle :app:assembleDebug

      - name: Copy release files
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Diza-v0.3.7.apk
          cp app/src/main/res/raw/diza_opening.mp4 diza-opening-v1.mp4
          cp app/src/main/res/drawable-nodpi/diza_avatar_default.png avatar-source-v2.png

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Diza-v0.3.7
          path: Diza-v0.3.7.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v0.3.7 --cleanup-tag --yes || true
          git tag -f v0.3.7
          git push origin -f v0.3.7
          gh release create v0.3.7 \
            Diza-v0.3.7.apk \
            diza-opening-v1.mp4 \
            avatar-source-v2.png \
            --title "Diza v0.3.7" \
            --notes "Cinematic splash DIZA + AI Personal Assistant, opening video, seamless transition ke avatar, lalu seluruh UI fade-in. Transcript tetap audio-reactive di atas waveform."
