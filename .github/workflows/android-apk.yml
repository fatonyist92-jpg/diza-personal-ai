name: Build Diza APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "app/**"
      - "avatar-engine/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore debug signing cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: diza-debug-keystore-v1

      - name: Fetch bundled Diza avatar
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://ucc8379d82bc263fba16a7b2ead1.dl.dropboxusercontent.com/cd/0/get/DIUmPnHNwnOoac9ixtzawnbq1aArqmtZrSM1u0j0ILnhmPGDOTp6UMeRdWQseKUK5i1Sw_wYqKa_pWNmrVAQdr_BSdWPIPcCUo8RT1CpLMqiCYuZqNnNxhEMDvThEkFwgTeaPXVt4S9kvDEwmaF0Bpf0C_Ic1vMviX1Lt676ITMpQA/file?c_luid=41a51812' \
            --output app/src/main/res/drawable-nodpi/diza_avatar_default.png
          echo 'c614a927bc68b64c40862ada63139ad3fe3c7cc7b7312ff4f40372d20c674376  app/src/main/res/drawable-nodpi/diza_avatar_default.png' | sha256sum -c -

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle :app:assembleDebug

      - name: Copy APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Diza-v0.3.6.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Diza-v0.3.6
          path: Diza-v0.3.6.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v0.3.6 --cleanup-tag --yes || true
          git tag -f v0.3.6
          git push origin -f v0.3.6
          gh release create v0.3.6 Diza-v0.3.6.apk \
            --title "Diza v0.3.6" \
            --notes "Avatar diganti ke foto terbaru. Transcript dipindah tepat di atas waveform dan bergerak mengikuti level suara mic/TTS. Fake whole-photo motion tetap dimatikan."
