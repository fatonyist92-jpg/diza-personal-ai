name: Build Diza APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - ".buildpatch/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v0.3 source patch
        shell: bash
        run: |
          cat             .buildpatch/main_00a.b64             .buildpatch/main_00b.b64             .buildpatch/main_01.b64             .buildpatch/main_02.b64             .buildpatch/main_03.b64             .buildpatch/main_04.b64             | base64 -d > app/src/main/java/com/fatoni/diza/MainActivity.kt

          cat             .buildpatch/html_00.b64             .buildpatch/html_01.b64             .buildpatch/html_02.b64             .buildpatch/html_03.b64             | base64 -d > app/src/main/assets/avatar/index.html

          echo "MainActivity bytes: $(wc -c < app/src/main/java/com/fatoni/diza/MainActivity.kt)"
          echo "Avatar HTML bytes: $(wc -c < app/src/main/assets/avatar/index.html)"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Diza-v0.3.0-test-debug
          path: app/build/outputs/apk/debug/app-debug.apk
