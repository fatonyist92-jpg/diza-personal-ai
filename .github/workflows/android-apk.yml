name: Build Diza APK

on:
  workflow_dispatch:
  push:
    branches: [ main, live-avatar-v0.1 ]
    paths:
      - "app/**"
      - "avatar-engine/**"
      - "live-avatar/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Normalize uploaded Diza base portrait
        run: |
          src="$(find app/src/main/res/drawable -maxdepth 1 -type f -iname '*.png' ! -name 'diza_avatar_default.png' | head -n 1)"
          if [ -n "$src" ]; then
            cp "$src" app/src/main/res/drawable/diza_avatar_default.png
            rm "$src"
          fi
      - name: Restore debug signing cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: diza-debug-keystore-v1
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Match opening endpoint to idle start
        run: |
          # Replace the last ~0.45 s of opening with a short bridge into the first idle frame.
          # This removes the visible pose jump without reintroducing a black/fade transition.
          ffmpeg -y -i app/src/main/res/raw/diza_opening.mp4 -i app/src/main/res/raw/diza_wait.mp4 -filter_complex "[0:v]trim=end=4.55,setpts=PTS-STARTPTS[a];[1:v]trim=start=0:end=0.45,setpts=PTS-STARTPTS[b];[a][b]xfade=transition=fade:duration=0.30:offset=4.25[v]" -map "[v]" -an -c:v libx264 -preset fast -crf 18 -pix_fmt yuv420p app/src/main/res/raw/diza_opening_bridge.mp4

      - name: Generate ping-pong reverse clips
        run: |
          ffmpeg -y -i app/src/main/res/raw/diza_wait.mp4 -an -vf reverse app/src/main/res/raw/diza_wait_reverse.mp4
          ffmpeg -y -i app/src/main/res/raw/diza_talk_short.mp4 -an -vf reverse app/src/main/res/raw/diza_talk_short_reverse.mp4
          ffmpeg -y -i app/src/main/res/raw/diza_talk_long.mp4 -an -vf reverse app/src/main/res/raw/diza_talk_long_reverse.mp4
      - name: Build APK
        run: gradle :app:assembleDebug
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Diza-LiveAvatar-Preview.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Diza-LiveAvatar-Preview
          path: Diza-LiveAvatar-Preview.apk
          retention-days: 14
