<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Diza Bot Agent</title>
<style>
:root{
  --bg:#020407;--panel:#0b0e13;--panel2:#11151c;--panel3:#171b23;--line:#242a34;
  --text:#f7f8fb;--muted:#8d95a3;--muted2:#626a77;--purple:#7b3cff;--purple2:#a95cff;
  --blue:#376dff;--red:#ff3b43;--green:#48d76f;--radius:18px;--safe-bottom:max(14px,env(safe-area-inset-bottom));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#000;color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;height:100%;overflow:hidden}
button,input,textarea{font:inherit}
button{color:inherit}
#app{height:100%;background:radial-gradient(circle at 60% -15%,rgba(99,45,255,.13),transparent 33%),linear-gradient(#020406,#030508 72%,#000);overflow:hidden}
.screen{height:100%;display:flex;flex-direction:column;min-height:0}
.content{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 16px 18px}
.content::-webkit-scrollbar{display:none}
.top{height:66px;display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid rgba(255,255,255,.025);flex:none}
.brand{font-size:32px;font-weight:500;letter-spacing:4px;background:linear-gradient(90deg,#a85fff,#7e4dff 50%,#d7c9ff);-webkit-background-clip:text;color:transparent;margin-right:auto}
.topTitle{font-size:18px;font-weight:650;flex:1;text-align:center}
.iconBtn,.circleBtn{border:1px solid var(--line);background:#0a0d12;display:grid;place-items:center;cursor:pointer}
.iconBtn{width:42px;height:42px;border-radius:14px;font-size:21px}
.circleBtn{width:38px;height:38px;border-radius:50%;font-size:19px}
.circleBtn.primary{background:linear-gradient(135deg,#5c36ff,#8e42ff);border-color:#8f64ff;box-shadow:0 0 18px rgba(111,54,255,.25)}
.back{border:0;background:transparent;font-size:30px;line-height:1;padding:2px 10px 2px 0;cursor:pointer}
.card{background:linear-gradient(180deg,#151922,#10141a);border:1px solid #202630;border-radius:16px}
.fieldLabel{color:#9da4af;font-size:14px;margin:17px 0 7px}
.input,.textarea{width:100%;background:#151922;border:1px solid #272d38;color:#fff;border-radius:12px;padding:13px 14px;outline:none}
.input:focus,.textarea:focus{border-color:#6543cc;box-shadow:0 0 0 2px rgba(123,60,255,.12)}
.textarea{min-height:160px;resize:vertical;line-height:1.45}
.mini{font-size:12px;color:var(--muted)}
.sub{color:var(--muted);font-size:14px}
.section{margin-top:18px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.avatar{width:52px;height:52px;border-radius:50%;object-fit:cover;background:#151922;border:1px solid #333844;flex:none}
.avatar.sm{width:40px;height:40px}.avatar.lg{width:112px;height:112px}
.botRow{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid rgba(255,255,255,.045);cursor:pointer}
.botRow:last-child{border-bottom:0}
.botName{font-size:17px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.previewText{color:#9aa1ad;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.time{color:#737b88;font-size:12px;align-self:flex-start;margin-top:4px}
.dot{width:9px;height:9px;border-radius:50%;background:#146dff;box-shadow:0 0 10px rgba(20,109,255,.6)}
.bottomNav{height:74px;padding:6px 10px var(--safe-bottom);border-top:1px solid #141820;background:rgba(3,5,8,.96);display:grid;grid-template-columns:repeat(4,1fr);flex:none}
.navBtn{border:0;background:transparent;color:#737a87;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;cursor:pointer;border-radius:16px}
.navBtn .ni{font-size:22px}.navBtn.active{color:#9a64ff;background:#10131a}
.fabMenu{position:absolute;top:68px;right:18px;width:186px;background:#151821;border:1px solid #272d39;border-radius:14px;padding:6px;z-index:20;box-shadow:0 18px 50px #000}
.fabMenu button{width:100%;border:0;background:transparent;text-align:left;padding:12px;border-radius:10px;font-size:14px}.fabMenu button:active{background:#242936}
.searchBar{display:flex;gap:8px;margin:4px 0 8px}.searchBar.hidden{display:none}
.empty{text-align:center;color:#8a929f;padding:48px 20px}.emptyIcon{font-size:42px;opacity:.7;margin-bottom:10px}
.agentGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding-top:10px}
.agentCard{padding:14px;text-align:center;cursor:pointer}.agentCard .avatar{width:76px;height:76px;margin:auto}.agentCard .botName{margin-top:9px}
.addCard{min-height:150px;display:grid;place-items:center;border:1px dashed #3a2b5f;background:rgba(123,60,255,.04);cursor:pointer}
.sectionBtn{width:100%;display:flex;align-items:center;gap:12px;padding:15px 14px;border:1px solid #1d222b;background:#0e1117;border-radius:13px;margin:8px 0;text-align:left;cursor:pointer}
.sectionIcon{width:34px;height:34px;border-radius:10px;background:#171c24;display:grid;place-items:center;font-size:17px}
.chev{font-size:22px;color:#666f7b}
.avatarPicker{text-align:center;padding:10px 0 0}.avatarWrap{position:relative;width:116px;margin:auto}.avatarEdit{position:absolute;right:0;bottom:2px;width:34px;height:34px;border-radius:50%;background:#7b3cff;border:3px solid #040609;display:grid;place-items:center}
.hiddenInput{position:absolute;left:-9999px}
.markShapes,.markColors{display:flex;gap:15px;align-items:center;flex-wrap:wrap;padding:8px 0}
.mark{width:28px;height:28px;background:#313641;cursor:pointer;opacity:.75;position:relative}.mark.selected{outline:2px solid #975cff;outline-offset:4px;opacity:1}
.mark.circle{border-radius:50%}.mark.square{border-radius:5px}.mark.triangle{clip-path:polygon(50% 0,100% 100%,0 100%)}.mark.hex{clip-path:polygon(25% 7%,75% 7%,100% 50%,75% 93%,25% 93%,0 50%)}.mark.cloud{border-radius:45% 55% 48% 52%}.mark.drop{border-radius:55% 45% 55% 45%;transform:rotate(45deg)}
.colorDot{width:24px;height:24px;border-radius:50%;cursor:pointer}.colorDot.selected{outline:2px solid #fff;outline-offset:3px}
.counter{text-align:right;color:#6f7783;font-size:12px;margin-top:4px}
.quickRow{display:flex;gap:8px;margin:8px 0}.quickRow .input{padding:11px 12px}.trash{width:38px;border:1px solid #252a34;background:#10131a;border-radius:10px;color:#9da3ae}
.addWide{width:100%;border:0;background:#1a1724;color:#9b65ff;border-radius:11px;padding:12px;margin-top:10px}
.choice{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid #252a32}.choice:last-child{border-bottom:0}.radio{width:20px;height:20px;border-radius:50%;border:2px solid #303640;margin-left:auto}.choice.selected .radio{border-color:#8554ff;box-shadow:inset 0 0 0 5px #0f1218;background:#8b55ff}
.switch{width:46px;height:25px;border-radius:16px;background:#303641;position:relative;margin-left:auto;cursor:pointer;flex:none}.switch:after{content:"";position:absolute;width:21px;height:21px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.18s}.switch.on{background:linear-gradient(90deg,#7031ee,#9c4dff)}.switch.on:after{left:23px}
.settingRow{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid #222731}.settingRow:last-child{border-bottom:0}
.dangerBtn{width:100%;background:#2a1114;border:1px solid #4a171b;color:#ff646a;border-radius:12px;padding:12px}
.previewProfile{text-align:center;padding:14px 0 6px}.previewBubble{padding:14px;margin:16px 0;display:flex;gap:10px;text-align:left}
.badgeAI{font-size:10px;background:#633cff;border-radius:5px;padding:2px 5px;color:#fff}
.chatHead{height:64px;display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid #171b23;flex:none}
.chatHead .avatar{width:42px;height:42px}.chatHead .botName{font-size:16px}
.chatTools{display:flex;gap:8px;padding:8px 12px;border-bottom:1px solid #11151c;overflow:auto;flex:none}.toolChip{border:1px solid #242a34;background:#0d1015;color:#b0b6c0;border-radius:999px;padding:8px 11px;white-space:nowrap}
.messages{flex:1;min-height:0;overflow-y:auto;padding:14px 12px 20px}.msg{max-width:84%;padding:11px 13px;border-radius:15px;margin:7px 0;line-height:1.4;white-space:pre-wrap;font-size:15px}.msg.user{margin-left:auto;background:#5c35df;border-bottom-right-radius:5px}.msg.assistant{background:#151922;border:1px solid #232936;border-bottom-left-radius:5px}
.composer{padding:8px 10px var(--safe-bottom);border-top:1px solid #171b23;background:#030508;flex:none}.composeRow{display:flex;align-items:flex-end;gap:8px}.composeInput{flex:1;min-height:44px;max-height:120px;background:#12161d;border:1px solid #272d37;border-radius:15px;color:#fff;padding:11px 13px;resize:none}.sendBtn{width:44px;height:44px;border:0;border-radius:14px;background:linear-gradient(135deg,#6336ee,#8c4cff);font-size:20px}.plusBtn{width:42px;height:42px;border:1px solid #272c35;border-radius:13px;background:#10131a;font-size:22px}
.attachMenu{position:absolute;bottom:78px;left:12px;background:#151922;border:1px solid #272d38;border-radius:14px;padding:6px;width:190px;z-index:10}.attachMenu button{width:100%;border:0;background:transparent;text-align:left;padding:11px;border-radius:9px}.attachMenu hr{border:0;border-top:1px solid #292e37}
.pending{display:flex;gap:7px;overflow-x:auto;padding:0 0 7px}.fileTag{font-size:12px;background:#171b23;border:1px solid #252b36;border-radius:9px;padding:7px 9px;white-space:nowrap}
.taskRow{padding:13px 14px;margin:9px 0;cursor:pointer}.status{font-size:11px;border-radius:999px;padding:4px 8px;background:#202632;color:#bbc2cc}
.status.completed{background:#12321d;color:#65e38a}.status.failed{background:#36171a;color:#ff767c}.status.running{background:#241c47;color:#a98cff}
.groupStack{width:54px;height:54px;position:relative;flex:none}.groupStack img{position:absolute;width:36px;height:36px;border-radius:12px;border:2px solid #05070a;object-fit:cover}.groupStack img:nth-child(1){left:0;top:0}.groupStack img:nth-child(2){right:0;bottom:0}.groupStack img:nth-child(3){right:0;top:0;width:27px;height:27px}
.memberPick{display:flex;align-items:center;gap:11px;padding:11px;border-bottom:1px solid #232832}.check{width:22px;height:22px;border-radius:7px;border:1px solid #3a414d;margin-left:auto;display:grid;place-items:center}.memberPick.selected .check{background:#7541f6;border-color:#8d60ff}
.notice{padding:11px 13px;border:1px solid #2a2440;background:#100c1b;border-radius:12px;color:#bba8e8;font-size:12px;line-height:1.45}
.loginWrap{height:100%;display:grid;place-items:center;padding:24px}.loginCard{width:min(420px,100%);padding:24px}.loginLogo{font-size:40px;letter-spacing:5px;background:linear-gradient(90deg,#a85fff,#735cff,#d5c9ff);-webkit-background-clip:text;color:transparent;text-align:center;margin-bottom:28px}.primaryBtn{width:100%;border:0;border-radius:12px;padding:13px;background:linear-gradient(135deg,#6336ee,#8f4cff);font-weight:650;margin-top:14px}.linkBtn{border:0;background:transparent;color:#a775ff;padding:10px;width:100%}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#1b2029;border:1px solid #303744;color:#fff;border-radius:12px;padding:10px 14px;z-index:99;max-width:90%;font-size:13px}
@media(min-width:700px){#app{max-width:440px;margin:auto;border-left:1px solid #151923;border-right:1px solid #151923}.agentGrid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="app"></div>
<input id="avatarFile" class="hiddenInput" type="file" accept="image/*">
<input id="attachFile" class="hiddenInput" type="file" accept="application/pdf">
<input id="attachImage" class="hiddenInput" type="file" accept="image/*">
<input id="cameraFile" class="hiddenInput" type="file" accept="image/*" capture="environment">
<script>
const API='/_api/native';
const AV='/_cdn/static/2daabeef-aac9-4289-9026-12a342ed4eee-diza-bot-agent-icon.png';
const app=document.getElementById('app');
const state={
  bots:[],tab:'chats',currentBot:null,currentGroup:null,botDraft:null,botDraftSource:null,
  pendingAttachments:[],attachOpen:false,plusOpen:false,searchOpen:false,busy:false
};
const MODEL_OPTIONS=[
  {id:'auto',name:'Auto · Diza Mesh',desc:'Router memilih model gratis terbaik'},
  {id:'fast',name:'Fast',desc:'Prioritas respons cepat'},
  {id:'balanced',name:'Balanced',desc:'Seimbang kualitas dan kecepatan'},
  {id:'deep',name:'Deep',desc:'Prioritas reasoning untuk tugas berat'},
  {id:'coding',name:'Coding',desc:'Prioritas model untuk coding dan GitHub'}
];
const TOOL_OPTIONS=[
  {id:'webSearch',name:'Web Search',desc:'Cari informasi real-time',icon:'◎'},
  {id:'fileAnalysis',name:'File Analysis',desc:'Baca dan analisis file',icon:'▧'},
  {id:'imageGeneration',name:'Image Generation',desc:'Generate images',icon:'▣'},
  {id:'github',name:'GitHub',desc:'Akses repository dan code',icon:'◆'}
];
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function clone(v){return JSON.parse(JSON.stringify(v))}
function token(){return localStorage.getItem('diza_native_token')||''}
function setToken(v){if(v)localStorage.setItem('diza_native_token',v);else localStorage.removeItem('diza_native_token')}
function toast(msg){var d=document.createElement('div');d.className='toast';d.textContent=msg;document.body.appendChild(d);setTimeout(function(){d.remove()},2200)}
async function request(path,opts){
  opts=opts||{};var h=opts.headers||{};
  if(opts.body!==undefined)h['content-type']='application/json';
  if(opts.auth!==false&&token())h.authorization='Bearer '+token();
  var res=await fetch(API+path,{method:opts.method||'GET',headers:h,body:opts.body!==undefined?JSON.stringify(opts.body):undefined});
  var data={};try{data=await res.json()}catch(e){}
  if(!res.ok){var er=new Error(data.error||data.message||'Request failed');er.status=res.status;er.code=data.code;throw er}
  return data
}
function get(path){return request(path,{method:'GET'})}
function post(path,body,auth){return request(path,{method:'POST',body:body,auth:auth})}
function authFail(e){if(e&&e.status===401){logout();return true}return false}
function botConfig(bot){
  var c=bot&&bot.config&&typeof bot.config==='object'?clone(bot.config):{};
  if(!c.model)c.model='auto';
  if(!c.tools)c.tools={webSearch:true,fileAnalysis:true,imageGeneration:false,github:false};
  if(!c.memory)c.memory={longTerm:true,savePreferences:true,projectContext:true};
  if(!Array.isArray(c.quickPrompts))c.quickPrompts=[];
  if(!Array.isArray(c.routines))c.routines=[];
  if(!c.mark)c.mark={shape:'circle',color:'#7b3cff'};
  return c
}
function avatar(bot){return bot&&bot.avatarData?bot.avatarData:AV}
function groups(){try{return JSON.parse(localStorage.getItem('diza_groups')||'[]')}catch(e){return[]}}
function saveGroups(v){localStorage.setItem('diza_groups',JSON.stringify(v))}
function groupHistory(id){try{return JSON.parse(localStorage.getItem('diza_group_history_'+id)||'[]')}catch(e){return[]}}
function saveGroupHistory(id,v){localStorage.setItem('diza_group_history_'+id,JSON.stringify(v.slice(-120)))}
function convKey(id){return 'diza_conv_'+id}
function conv(id){var n=Number(localStorage.getItem(convKey(id))||0);return n||null}
function setConv(id,v){if(v)localStorage.setItem(convKey(id),String(v));else localStorage.removeItem(convKey(id))}
function previewKey(id){return 'diza_preview_'+id}
function lastPreview(id){try{return JSON.parse(localStorage.getItem(previewKey(id))||'null')}catch(e){return null}}
function savePreview(id,text){localStorage.setItem(previewKey(id),JSON.stringify({text:text,time:Date.now()}))}
function fmtTime(ms){if(!ms)return '';var d=new Date(ms),n=new Date();if(d.toDateString()===n.toDateString())return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});return d.toLocaleDateString([],{weekday:'short'})}
function navIcon(id){return id==='chats'?'◉':id==='agents'?'♙':id==='groups'?'♧':'⚙'}
function shapeHtml(mark){mark=mark||{shape:'circle',color:'#7b3cff'};return '<span class="mark '+esc(mark.shape||'circle')+'" style="background:'+esc(mark.color||'#7b3cff')+';width:18px;height:18px"></span>'}
function bottomNav(){
  return '<nav class="bottomNav">'+['chats','agents','groups','settings'].map(function(id){
    return '<button class="navBtn '+(state.tab===id?'active':'')+'" data-tab="'+id+'"><span class="ni">'+navIcon(id)+'</span><span>'+id.charAt(0).toUpperCase()+id.slice(1)+'</span></button>'
  }).join('')+'</nav>'
}
function wireNav(){document.querySelectorAll('[data-tab]').forEach(function(b){b.onclick=function(){state.tab=b.dataset.tab;state.plusOpen=false;renderHome()}})}
function topHome(){
  return '<header class="top"><div class="brand">DIZA</div><button class="iconBtn" id="searchBtn">⌕</button><button class="circleBtn" id="plusTop">＋</button></header>'+
    (state.searchOpen?'<div class="searchBar" style="padding:0 16px"><input id="homeSearch" class="input" placeholder="Search bots and groups"></div>':'')+
    (state.plusOpen?'<div class="fabMenu"><button id="newBot">🤖 &nbsp; New Bot</button><button id="newGroup">♣ &nbsp; New Group Chat</button></div>':'')
}
function bindTop(){
  var s=document.getElementById('searchBtn'),p=document.getElementById('plusTop');
  if(s)s.onclick=function(){state.searchOpen=!state.searchOpen;renderHome()};
  if(p)p.onclick=function(){state.plusOpen=!state.plusOpen;renderHome()};
  var nb=document.getElementById('newBot'),ng=document.getElementById('newGroup');
  if(nb)nb.onclick=function(){beginBot(null)};
  if(ng)ng.onclick=renderGroupEditor;
  var hs=document.getElementById('homeSearch');if(hs){hs.focus();hs.oninput=filterHome}
}
function filterHome(){
  var q=(document.getElementById('homeSearch').value||'').toLowerCase();
  document.querySelectorAll('[data-search]').forEach(function(x){x.style.display=x.dataset.search.toLowerCase().includes(q)?'flex':'none'})
}
async function boot(){
  if(!token()){renderAuth('login');return}
  try{var d=await get('/bots/list');state.bots=d.bots||[];renderHome()}
  catch(e){if(authFail(e))return;renderFatal(e.message)}
}
function renderFatal(m){app.innerHTML='<div class="loginWrap"><div class="card loginCard"><h2>Diza error</h2><p class="sub">'+esc(m)+'</p><button class="primaryBtn" onclick="boot()">Retry</button></div></div>'}
function renderAuth(mode){
  var reg=mode==='register';
  app.innerHTML='<div class="loginWrap"><div class="card loginCard"><div class="loginLogo">DIZA</div>'+
    '<div class="fieldLabel">Email</div><input class="input" id="authEmail" type="email" autocomplete="email">'+
    (reg?'<div class="fieldLabel">Display name</div><input class="input" id="authName" autocomplete="name">':'')+
    '<div class="fieldLabel">Password</div><input class="input" id="authPass" type="password" autocomplete="'+(reg?'new-password':'current-password')+'">'+
    '<div id="authErr" class="mini" style="color:#ff7378;margin-top:10px"></div>'+
    '<button class="primaryBtn" id="authGo">'+(reg?'Create account':'Sign in')+'</button>'+
    '<button class="linkBtn" id="authSwitch">'+(reg?'Already have an account? Sign in':'New here? Create account')+'</button></div></div>';
  document.getElementById('authSwitch').onclick=function(){renderAuth(reg?'login':'register')};
  document.getElementById('authGo').onclick=async function(){
    var btn=this;btn.disabled=true;var err=document.getElementById('authErr');err.textContent='';
    try{
      var body={email:document.getElementById('authEmail').value.trim(),password:document.getElementById('authPass').value};
      if(reg)body.displayName=document.getElementById('authName').value.trim();
      var d=await post(reg?'/register':'/login',body,false);setToken(d.token);await boot()
    }catch(e){err.textContent=e.message}finally{btn.disabled=false}
  }
}
function logout(){setToken('');state.bots=[];renderAuth('login')}
function renderHome(){
  state.currentBot=null;state.currentGroup=null;
  app.innerHTML='<div class="screen">'+topHome()+'<main class="content" id="homeBody"></main>'+bottomNav()+'</div>';
  bindTop();wireNav();
  if(state.tab==='chats')renderChats();
  if(state.tab==='agents')renderAgents();
  if(state.tab==='groups')renderGroups();
  if(state.tab==='settings')renderSettings();
}
function renderChats(){
  var body=document.getElementById('homeBody'),g=groups(),rows=[];
  state.bots.forEach(function(b){
    var p=lastPreview(b.id)||{},text=p.text||(b.isDefault?'APK siap ngobrol…':'Tap untuk mulai chat');
    rows.push('<div class="botRow" data-bot="'+b.id+'" data-search="'+esc(b.name+' '+b.title+' '+text)+'"><img class="avatar" src="'+esc(avatar(b))+'"><div class="grow"><div class="botName">'+esc(b.name)+'</div><div class="previewText">'+esc(text)+'</div></div><div class="time">'+esc(fmtTime(p.time))+'</div></div>')
  });
  g.forEach(function(x){
    var h=groupHistory(x.id),last=h[h.length-1],names=(x.botIds||[]).map(function(id){var b=state.bots.find(function(z){return z.id===id});return b?b.name:''}).filter(Boolean);
    rows.push('<div class="botRow" data-group="'+x.id+'" data-search="'+esc(x.name+' '+names.join(' '))+'">'+groupStackHtml(x)+'<div class="grow"><div class="botName">'+esc(x.name)+'</div><div class="previewText">'+esc(last?last.text:names.join(', '))+'</div></div><div class="time">'+esc(last?fmtTime(last.time):'')+'</div></div>')
  });
  body.innerHTML=rows.length?rows.join(''):'<div class="empty"><div class="emptyIcon">◌</div><div>No chats yet</div><p class="sub">Create a bot or group to start.</p></div>';
  body.querySelectorAll('[data-bot]').forEach(function(x){x.onclick=function(){openChat(Number(x.dataset.bot))}});
  body.querySelectorAll('[data-group]').forEach(function(x){x.onclick=function(){openGroupChat(x.dataset.group)}});

function imageData(file,max,q){return new Promise(function(resolve,reject){var r=new FileReader();r.onload=function(){var img=new Image();img.onload=function(){var scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',q))};img.onerror=reject;img.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}

async function loadConversation(){
  var id=conv(state.currentBot.id);if(!id){showWelcome();return}
  try{var d=await get('/conversations/get?id='+encodeURIComponent(id));drawMessages(d.messages||[])}
  catch(e){if(e.status===404){setConv(state.currentBot.id);showWelcome()}else if(!authFail(e))toast(e.message)}
}
async function sendChat(){
  if(state.busy)return;var input=document.getElementById('compose'),text=(input.value||'').trim();if(!text)return;
  state.busy=true;document.getElementById('send').disabled=true;input.value='';
  var optimistic=_messages.concat([{role:'user',content:text},{role:'assistant',content:'…'}]);drawMessages(optimistic);
  try{
    var payload={botId:state.currentBot.id,message:text,attachments:state.pendingAttachments.map(function(a){return {storageFilename:a.storageFilename,contentType:a.contentType,fileName:a.fileName}})};
    var cid=conv(state.currentBot.id);if(cid)payload.conversationId=cid;
    var d=await post('/chat',payload);setConv(state.currentBot.id,d.conversationId);state.pendingAttachments=[];drawMessages(d.messages||[]);
    var last=(d.messages||[]).filter(function(x){return x.role==='assistant'}).slice(-1)[0];savePreview(state.currentBot.id,last?last.content:text)
  }catch(e){if(!authFail(e)){toast(e.message);drawMessages(_messages.filter(function(x){return x.content!=='…'}))}}
  finally{state.busy=false;var s=document.getElementById('send');if(s)s.disabled=false;drawPending()}
}
async function uploadBinary(file){
  if(!file)return;if(file.size>50*1024*1024){toast('Maximum file size is 50 MB.');return}
  var allowed=['image/jpeg','image/png','image/webp','image/gif','application/pdf'];if(allowed.indexOf(file.type)<0){toast('Supported: PDF, JPG, PNG, WebP, GIF.');return}
  if(state.pendingAttachments.length>=3){toast('Maximum 3 attachments per message.');return}
  try{
    var mint=await post('/attachments/upload',{filename:file.name,contentType:file.type,sizeBytes:file.size});
    var put=await fetch(mint.uploadUrl,{method:'PUT',headers:{'content-type':file.type},body:file});if(!put.ok)throw new Error('Upload failed');
    state.pendingAttachments.push({storageFilename:mint.storageFilename,contentType:file.type,fileName:file.name});drawPending()
  }catch(e){toast(e.message)}
}
['attachFile','attachImage','cameraFile'].forEach(function(id){document.getElementById(id).onchange=function(){var f=this.files&&this.files[0];uploadBinary(f);this.value=''}})
function drawPending(){var x=document.getElementById('pending');if(!x)return;x.innerHTML=state.pendingAttachments.map(function(a,i){return '<span class="fileTag" data-pdel="'+i+'">'+esc(a.fileName||a.contentType)+' ×</span>'}).join('');x.querySelectorAll('[data-pdel]').forEach(function(t){t.onclick=function(){state.pendingAttachments.splice(Number(t.dataset.pdel),1);drawPending()}})}
async function renderMemoryList(bot){
  topSub('Memory',function(){state.currentBot=bot;renderChat(currentMessages())},function(){renderMemoryEditor(bot)});
  var body=document.getElementById('subBody');body.innerHTML='<div class="empty">Loading…</div>';
  try{
    var d=await get('/memories/list?botId='+encodeURIComponent(bot.id)),items=d.memories||[];
    body.innerHTML=(items.length?items.map(function(m){return '<div class="card taskRow"><div class="row"><b class="grow">'+esc(m.title||'Memory')+'</b><span class="status">'+esc(m.scope)+'</span></div><div class="sub" style="margin-top:7px;white-space:pre-wrap">'+esc(m.content)+'</div></div>'}).join(''):'<div class="empty">No memory yet</div>')+'<button class="primaryBtn" id="addMem">＋ Add Memory</button>';
    document.getElementById('addMem').onclick=function(){renderMemoryEditor(bot)}
  }catch(e){body.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}
}
function renderMemoryEditor(bot){
  topSub('Add Memory',function(){renderMemoryList(bot)},async function(){
    var content=document.getElementById('mc').value.trim(),scope=document.getElementById('ms').value;if(!content){toast('Memory content required');return}
    try{await post('/memories/save',{botId:scope==='bot'?bot.id:null,scope:scope,kind:'long_term',title:document.getElementById('mt').value.trim(),content:content,pinned:document.getElementById('mp').checked});renderMemoryList(bot)}
    catch(e){toast(e.message)}
  });
  document.getElementById('subBody').innerHTML='<div class="fieldLabel">Title</div><input id="mt" class="input"><div class="fieldLabel">Scope</div><select id="ms" class="input"><option value="bot">Private to '+esc(bot.name)+'</option><option value="workspace">Shared workspace</option></select><div class="fieldLabel">Content</div><textarea id="mc" class="textarea"></textarea><label class="row" style="margin-top:12px"><input id="mp" type="checkbox"> <span>Pin memory</span></label>'
}
async function renderSources(bot){
  topSub('Sources',function(){state.currentBot=bot;renderChat(currentMessages())},function(){renderSourceEditor(bot)});
  var body=document.getElementById('subBody');body.innerHTML='<div class="empty">Loading…</div>';
  try{
    var id=conv(bot.id),d=await get('/sources/list'+(id?'?conversationId='+encodeURIComponent(id):'')),items=d.sources||[];
    body.innerHTML=(items.length?items.map(function(s){return '<div class="card taskRow"><div class="row"><b class="grow">'+esc(s.name)+'</b><span class="status">'+esc(s.scope)+'</span></div><div class="mini" style="margin-top:6px">'+esc(s.sourceType)+'</div></div>'}).join(''):'<div class="empty">No sources</div>')+'<button class="primaryBtn" id="addSrc">＋ Add Source</button>';
    document.getElementById('addSrc').onclick=function(){renderSourceEditor(bot)}
  }catch(e){body.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}
}
function renderSourceEditor(bot){
  topSub('Add Source',function(){state.currentBot=bot;renderChat(currentMessages())},async function(){
    var name=document.getElementById('sn').value.trim(),content=document.getElementById('sc').value.trim(),scope=document.getElementById('ss').value;if(!name||!content){toast('Name and content required');return}
    try{
      var payload={scope:scope,name:name,sourceType:document.getElementById('st').value,content:content};
      if(scope==='conversation'){var id=conv(bot.id);if(id)payload.conversationId=id;else payload.botId=bot.id}
      var d=await post('/sources/save',payload);if(d.conversationId)setConv(bot.id,d.conversationId);renderSources(bot)
    }catch(e){toast(e.message)}
  });
  document.getElementById('subBody').innerHTML='<div class="fieldLabel">Name</div><input id="sn" class="input"><div class="fieldLabel">Scope</div><select id="ss" class="input"><option value="conversation">Source for this chat</option><option value="main">Main source for all</option></select><div class="fieldLabel">Type</div><select id="st" class="input"><option value="text">Text</option><option value="url">URL</option></select><div class="fieldLabel">Content / URL</div><textarea id="sc" class="textarea"></textarea>'
}
async function renderTasks(){
  app.innerHTML='<div class="screen"><header class="top"><button class="back" id="tb">‹</button><div class="topTitle">Tasks</div><span style="width:38px"></span></header><main class="content" id="taskBody"><div class="empty">Loading…</div></main></div>';
  document.getElementById('tb').onclick=function(){state.tab='settings';renderHome()};
  try{
    var d=await get('/tasks/list'),items=d.tasks||[],body=document.getElementById('taskBody');
    body.innerHTML=items.length?items.map(function(t){
      return '<div class="card taskRow" data-taskid="'+t.id+'"><div class="row"><b class="grow">'+esc(t.title)+'</b><span class="status '+esc(t.status)+'">'+esc(t.status)+'</span></div><div class="sub" style="margin-top:6px">'+esc(t.instruction)+'</div><div class="mini" style="margin-top:6px">'+t.stepCount+' steps</div></div>'
    }).join(''):'<div class="empty"><div class="emptyIcon">✓</div><div>No tasks yet</div><p class="sub">Tasks are created by group collaboration or the task orchestrator.</p></div>';
    body.querySelectorAll('[data-taskid]').forEach(function(x){x.onclick=function(){renderTaskDetail(Number(x.dataset.taskid))}})
  }catch(e){if(!authFail(e))document.getElementById('taskBody').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}
}
async function renderTaskDetail(id){
  app.innerHTML='<div class="screen"><header class="top"><button class="back" id="tdb">‹</button><div class="topTitle">Task Detail</div><span style="width:38px"></span></header><main class="content" id="taskDetail"><div class="empty">Loading…</div></main></div>';
  document.getElementById('tdb').onclick=renderTasks;
  try{
    var d=await get('/tasks/get?id='+encodeURIComponent(id)),t=d.task,body=document.getElementById('taskDetail');
    body.innerHTML='<div class="section"><h2 style="margin-bottom:6px">'+esc(t.title)+'</h2><div class="sub">'+esc(t.instruction)+'</div></div>'+
      '<div class="section">'+(t.steps||[]).map(function(x){
        return '<div class="card taskRow"><div class="row"><b class="grow">'+esc(x.botName)+'</b><span class="status '+esc(x.status)+'">'+esc(x.status)+'</span></div><div class="mini" style="margin-top:7px">'+esc(x.instruction)+'</div>'+(x.output?'<div style="margin-top:10px;white-space:pre-wrap">'+esc(x.output)+'</div>':'')+'</div>'
      }).join('')+'</div>'+
      (t.status==='queued'||t.status==='failed'?'<button class="primaryBtn" id="runTask">Run Task</button>':'');
    var run=document.getElementById('runTask');if(run)run.onclick=async function(){run.disabled=true;try{await post('/tasks/run',{taskId:id});renderTaskDetail(id)}catch(e){toast(e.message);run.disabled=false}}
  }catch(e){if(!authFail(e))document.getElementById('taskDetail').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}
}
function renderGroupEditor(){
  var g={id:'g'+Date.now(),name:'',botIds:[]};
  app.innerHTML='<div class="screen"><header class="top"><button class="back" id="gb">‹</button><div class="topTitle">New Group Chat</div><button class="circleBtn primary" id="gs">✓</button></header><main class="content"><div class="fieldLabel">Group name</div><input id="gn" class="input" placeholder="e.g. Tim Surya Toto"><div class="fieldLabel">Select bots</div><div class="card" id="members">'+state.bots.map(function(b){return '<div class="memberPick" data-mid="'+b.id+'"><img class="avatar sm" src="'+esc(avatar(b))+'"><div class="grow"><b>'+esc(b.name)+'</b><div class="mini">'+esc(b.title||'')+'</div></div><div class="check">✓</div></div>'}).join('')+'</div><div class="notice section">Bot hanya berkolaborasi setelah kamu mengirim task di group ini.</div></main></div>';
  document.getElementById('gb').onclick=function(){state.tab='groups';renderHome()};
  document.querySelectorAll('[data-mid]').forEach(function(x){x.onclick=function(){var id=Number(x.dataset.mid),i=g.botIds.indexOf(id);if(i>=0)g.botIds.splice(i,1);else g.botIds.push(id);x.classList.toggle('selected',g.botIds.indexOf(id)>=0)}});
  document.getElementById('gs').onclick=function(){g.name=document.getElementById('gn').value.trim();if(!g.name||g.botIds.length<2){toast('Name and at least 2 bots required');return}var all=groups();all.push(g);saveGroups(all);state.tab='groups';renderHome()}
}
function openGroupChat(id){
  var g=groups().find(function(x){return x.id===id});if(!g)return;state.currentGroup=g;renderGroupChat()
}
function renderGroupChat(){
  var g=state.currentGroup,h=groupHistory(g.id),members=(g.botIds||[]).map(function(id){return state.bots.find(function(b){return b.id===id})}).filter(Boolean);
  app.innerHTML='<div class="screen"><header class="chatHead"><button class="back" id="gback">‹</button>'+groupStackHtml(g)+'<div class="grow"><div class="botName">'+esc(g.name)+'</div><div class="mini">'+esc(members.map(function(b){return b.name}).join(', '))+'</div></div><button class="iconBtn" id="gmenu">⋮</button></header><main class="messages" id="gmess">'+(h.length?h.map(function(m){return '<div class="msg '+(m.role==='user'?'user':'assistant')+'">'+(m.bot?'<b>'+esc(m.bot)+':</b><br>':'')+esc(m.text)+'</div>'}).join(''):'<div class="empty"><div class="emptyIcon">♣</div><div>'+esc(g.name)+'</div><p class="sub">Send one task. Selected bots execute in order.</p></div>')+'</main><div class="composer"><div class="composeRow"><textarea id="ginput" class="composeInput" placeholder="Assign a task to the group"></textarea><button class="sendBtn" id="gsend">➤</button></div></div></div>';
  document.getElementById('gback').onclick=function(){state.tab='groups';renderHome()};
  document.getElementById('gmenu').onclick=function(){if(confirm('Delete this group?')){saveGroups(groups().filter(function(x){return x.id!==g.id}));localStorage.removeItem('diza_group_history_'+g.id);state.tab='groups';renderHome()}};
  document.getElementById('gsend').onclick=sendGroupTask;
}
async function sendGroupTask(){
  var input=document.getElementById('ginput'),text=(input.value||'').trim();if(!text||state.busy)return;
  var g=state.currentGroup,h=groupHistory(g.id);h.push({role:'user',text:text,time:Date.now()});saveGroupHistory(g.id,h);renderGroupChat();state.busy=true;
  try{
    var steps=(g.botIds||[]).map(function(id){return {botId:id,instruction:'Respond to the user task from your assigned role. Build on earlier assigned bot outputs when useful.'}});
    var c=await post('/tasks/create',{title:'Group: '+g.name,instruction:text,steps:steps});
    var r=await post('/tasks/run',{taskId:c.taskId});
    var hh=groupHistory(g.id);(r.steps||[]).forEach(function(s){hh.push({role:'assistant',bot:s.botName,text:s.output,time:Date.now()})});saveGroupHistory(g.id,hh);renderGroupChat()
  }catch(e){toast(e.message)}finally{state.busy=false}
}
window.onerror=function(m){console.error(m);toast('UI error: '+m)};
boot();
</script>
