<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

.fileLabel{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 13px;border:1px solid #29292e;border-radius:13px;background:#0b0b0d;color:#d8d8dd;font-size:12px;font-weight:700}

.hint{font-size:11px;color:#66666e;line-height:1.45;margin:-2px 2px 12px}

.messages{flex:1;overflow:auto;padding:16px 13px 24px}

.welcome .avatar{width:66px;height:66px;border-radius:21px;margin:auto}
.welcome h2{font-size:25px;letter-spacing:-.04em;margin:17px 0 8px}
.welcome p{font-size:13px;color:#75757c;line-height:1.55;margin:0 auto}
.msgRow{display:flex;margin:13px 0}
.msgRow.user{justify-content:flex-end}

.composerArea{position:relative;flex:none;padding:10px 10px max(10px,env(safe-area-inset-bottom));background:linear-gradient(transparent,#000 24%)}

.composer textarea{flex:1;min-height:38px;max-height:112px;resize:none;background:transparent;border:0;outline:0;color:#fff;padding:8px 0;line-height:1.35}
.send{width:40px;height:40px;border:0;border-radius:13px;background:#f4f4f5;color:#050505;font-weight:900;font-size:17px}
.send:disabled{background:#202024;color:#56565d}
.attachMenu{position:absolute;left:10px;bottom:72px;width:260px;padding:8px;border:1px solid #44444b;border-radius:22px;background:#1b1b1e;box-shadow:0 16px 40px rgba(0,0,0,.55);z-index:30}
.attachItem{width:100%;height:54px;border:0;background:transparent;color:#f4f4f5;display:flex;align-items:center;gap:13px;padding:0 12px;border-radius:14px;text-align:left;font-size:14px}
.attachItem:active{background:#29292d}
.attachIcon{width:28px;text-align:center;color:#b8b8c0;font-size:20px}
.attachSep{height:1px;background:#35353a;margin:5px 8px}
.pending{display:flex;gap:7px;overflow:auto;padding:0 2px 8px}
.pending:empty{display:none}
.pendingChip{display:flex;align-items:center;gap:6px;max-width:180px;border:1px solid #28282d;background:#0c0c0e;border-radius:12px;padding:7px 9px;font-size:10px;color:#aaa}
.pendingChip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pendingChip button{border:0;background:transparent;color:#777;font-size:14px;padding:0}
.scopeChoice{display:flex;align-items:center;gap:12px;padding:15px;border:1px solid #25252a;border-radius:18px;background:#0a0a0c;margin-bottom:10px}
.scopeChoice.on{border-color:#466da8;background:#0c1119}
.scopeRadio{width:22px;height:22px;border-radius:50%;border:2px solid #777;display:grid;place-items:center;flex:none}
.scopeChoice.on .scopeRadio{border-color:#4291ff}
.scopeChoice.on .scopeRadio:after{content:"";width:10px;height:10px;border-radius:50%;background:#4291ff}
.scopeCopy{flex:1}.scopeCopy b{display:block;font-size:14px}.scopeCopy span{display:block;font-size:11px;color:#777780;margin-top:4px}
.sourceTypeRow{display:flex;gap:7px;margin-bottom:12px}
.sourceTypeBtn{flex:1;height:40px;border:1px solid #25252a;border-radius:12px;background:#08080a;color:#85858e;font-size:11px}
.sourceTypeBtn.on{border-color:#53535a;color:#fff;background:#151518}
.chatTools{display:flex;gap:7px;padding:7px 10px;border-bottom:1px solid #111}
.toolChip{height:34px;border:1px solid #202024;border-radius:11px;background:#070708;color:#aaa;font-size:11px;padding:0 11px}
.floating{position:absolute;right:18px;bottom:24px;width:54px;height:54px;border:0;border-radius:18px;background:#f3f3f4;color:#060607;font-size:26px;font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.relative{position:relative}
.taskStep{border:1px solid #1e1e22;border-radius:16px;padding:11px;background:#070708;margin-bottom:10px}
.taskStepTop{display:flex;gap:8px;align-items:center}
.taskStepTop .select{margin:0;flex:1}
.removeStep{width:42px;height:42px;border:1px solid #3b2025;background:#12090a;color:#ff858c;border-radius:13px}
.status{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.status.completed{color:#55dda2}.status.running{color:#d8bc67}.status.failed{color:#ff757d}.status.queued{color:#81818a}
.output{margin-top:10px;padding-top:10px;border-top:1px solid #1a1a1e;font-size:12px;line-height:1.55;color:#cfcfd4;white-space:pre-wrap}
.dual{display:flex;gap:9px}.dual>*{flex:1}
.fatal{height:100%;display:grid;place-items:center;text-align:center;padding:30px}
.fatal button{margin-top:16px;padding:11px 16px;border:0;border-radius:13px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const AV='/_cdn/static/2daabeef-aac9-4289-9026-12a342ed4eee-diza-bot-agent-icon.png';
const API='/_api/native';
const app=document.getElementById('app');
const state={bots:[],currentBot:null,busy:false,taskDraft:null,pendingAttachments:[]};

window.onerror=function(m){
  app.innerHTML='<div class="fatal"><div><h2>Diza UI error</h2><p>'+esc(String(m))+'</p><button onclick="location.reload()">Reload</button></div></div>';
};

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function token(){return localStorage.getItem('diza_native_token')||''}
function setToken(t){localStorage.setItem('diza_native_token',t)}
function logout(){
  localStorage.removeItem('diza_native_token');
  Object.keys(localStorage).filter(function(k){return k.indexOf('conv_bot_')===0}).forEach(function(k){localStorage.removeItem(k)});
  state.bots=[];state.currentBot=null;renderAuth(false);
}
function avatarOf(bot){return bot&&bot.avatarData?bot.avatarData:AV}
function convKey(botId){return 'conv_bot_'+botId}
function conv(botId){return Number(localStorage.getItem(convKey(botId))||0)||undefined}
function setConv(botId,v){if(v)localStorage.setItem(convKey(botId),String(v));else localStorage.removeItem(convKey(botId))}

async function request(path,opts){
  opts=opts||{};
  const headers=opts.headers||{};
  if(opts.body!==undefined)headers['content-type']='application/json';
  if(opts.auth!==false&&token())headers.authorization='Bearer '+token();
  const res=await fetch(API+path,{method:opts.method||'GET',headers:headers,body:opts.body!==undefined?JSON.stringify(opts.body):undefined});
  let data={};try{data=await res.json()}catch(e){}
  if(!res.ok){
    const err=new Error(data.error||data.message||'Request failed');
    err.status=res.status;err.code=data.code;throw err;
  }
  return data;
}
function get(path){return request(path,{method:'GET'})}
function post(path,body,auth){return request(path,{method:'POST',body:body,auth:auth})}
function authFail(e){if(e&&e.status===401){logout();return true}return false}

async function uploadBinary(file){
  if(!file)throw new Error('No file selected');
  if(file.size>10*1024*1024)throw new Error('Maximum file size is 10 MB.');
  const allowed=['image/jpeg','image/png','image/webp','image/gif','application/pdf'];
  if(allowed.indexOf(file.type)<0)throw new Error('Supported: PDF, JPG, PNG, WebP, GIF.');
  const mint=await post('/attachments/upload',{filename:file.name,contentType:file.type,sizeBytes:file.size});
  const put=await fetch(mint.presignedUrl,{method:'PUT',headers:{'Content-Type':file.type},body:file});
  if(!put.ok)throw new Error('File upload failed.');
  return {storageFilename:mint.storageFilename,contentType:file.type,fileName:file.name};
}
function drawPending(){
  const box=document.getElementById('pendingAttachments');if(!box)return;
  box.innerHTML=state.pendingAttachments.map(function(a,i){
    return '<div class="pendingChip"><span>'+esc(a.fileName||'Attachment')+'</span><button data-rm="'+i+'">×</button></div>';
  }).join('');
  box.querySelectorAll('[data-rm]').forEach(function(b){b.onclick=function(){
    state.pendingAttachments.splice(Number(b.dataset.rm),1);drawPending();
  }});
}

function renderAuth(reg){
  app.innerHTML='<div class="auth"><div class="authCard">'+
    '<img class="authLogo" src="'+AV+'"><div class="eyebrow">DIZA BOT AGENT</div>'+
    '<h1>'+(reg?'Create account':'Welcome back')+'</h1>'+
    '<p class="muted">'+(reg?'Create your private AI workspace.':'Sign in to continue to your bot workspace.')+'</p>'+
    (reg?'<input id="name" class="field" placeholder="Display name" autocomplete="name">':'')+
    '<input id="email" class="field" placeholder="Email" type="email" autocomplete="email">'+
    '<input id="pass" class="field" placeholder="Password" type="password" autocomplete="'+(reg?'new-password':'current-password')+'">'+
    '<div id="err" class="error"></div>'+
    '<button id="go" class="primary">'+(reg?'Create account':'Sign in')+'</button>'+
    '<button id="swap" class="secondary">'+(reg?'Already have an account? Sign in':'New here? Create account')+'</button>'+
    '</div></div>';
  document.getElementById('swap').onclick=function(){renderAuth(!reg)};
  document.getElementById('go').onclick=async function(){
    const btn=document.getElementById('go'),err=document.getElementById('err');
    const email=document.getElementById('email').value.trim();
    const password=document.getElementById('pass').value;
    const displayName=reg?document.getElementById('name').value.trim():'';
    if(!email||password.length<8||(reg&&!displayName)){err.textContent='Check your email, name, and password.';return}
    btn.disabled=true;err.textContent='';
    try{
      const d=await post(reg?'/register':'/login',{email:email,password:password,...(reg?{displayName:displayName}:{})},false);
      setToken(d.token);await boot();
    }catch(e){err.textContent=e.message}
    finally{btn.disabled=false}
  };
}

async function boot(){
  try{
    const d=await get('/bots/list');
    state.bots=d.bots||[];
    renderHome();
  }catch(e){
    if(authFail(e))return;
    app.innerHTML='<div class="fatal"><div><h2>Could not load workspace</h2><p>'+esc(e.message)+'</p><button onclick="boot()">Retry</button></div></div>';
  }
}

function renderHome(){
  state.currentBot=null;
  app.innerHTML='<div class="screen relative">'+
    '<header class="top"><div class="topTitle"><b>DIZA</b><span>Bot workspace</span></div>'+
    '<button id="tasksBtn" class="iconBtn" title="Tasks">✓</button>'+
    '<button id="addBot" class="iconBtn" title="New bot">＋</button></header>'+
    '<div class="searchWrap"><input id="search" class="search" placeholder="Search bots"></div>'+
    '<main class="scroll"><div id="botList" class="list"></div></main>'+
    '</div>';
  document.getElementById('addBot').onclick=function(){renderBotEditor(null)};
  document.getElementById('tasksBtn').onclick=renderTasks;
  document.getElementById('search').oninput=function(){drawBotList(this.value)};
  drawBotList('');
}

function drawBotList(query){
  const box=document.getElementById('botList');if(!box)return;
  const q=String(query||'').toLowerCase();
  const bots=state.bots.filter(function(b){return !q||b.name.toLowerCase().includes(q)||(b.title||'').toLowerCase().includes(q)});
  if(!bots.length){
    box.innerHTML='<div class="empty"><h3>No bots yet</h3><p>Tap + to create your first custom bot.</p></div>';return;
  }
  box.innerHTML=bots.map(function(b){
    const preview=b.title||((b.instructions||'').slice(0,90))||'Tap to chat';
    return '<div class="botRow" data-id="'+b.id+'">'+
      '<img class="avatar" src="'+esc(avatarOf(b))+'">'+
      '<div class="botMain"><div class="botNameLine"><div class="botName">'+esc(b.name)+'</div>'+(b.isDefault?'<span class="badge">DEFAULT</span>':'')+'</div>'+
      '<div class="preview">'+esc(preview)+'</div></div>'+
      '<button class="rowBtn settings" data-edit="'+b.id+'">⋮</button></div>';
  }).join('');
  box.querySelectorAll('.botRow').forEach(function(row){
    row.onclick=function(e){
      if(e.target.closest('.settings'))return;
      const bot=state.bots.find(function(x){return x.id===Number(row.dataset.id)});
      if(bot)renderChat(bot);
    };
  });
  box.querySelectorAll('.settings').forEach(function(btn){
    btn.onclick=function(e){e.stopPropagation();const bot=state.bots.find(function(x){return x.id===Number(btn.dataset.edit)});if(bot)renderBotEditor(bot)};
  });
}

function compressAvatar(file){
  return new Promise(function(resolve,reject){
    const reader=new FileReader();
    reader.onerror=function(){reject(new Error('Could not read image'))};
    reader.onload=function(){
      const img=new Image();
      img.onerror=function(){reject(new Error('Invalid image'))};
      img.onload=function(){
        const max=512,scale=Math.min(1,max/Math.max(img.width,img.height));
        const w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));
        const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',0.82));
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function renderBotEditor(bot){
  let avatarData=bot?bot.avatarData:null;
  app.innerHTML='<div class="screen">'+
    '<header class="top"><button id="back" class="backBtn">‹</button><div class="topTitle"><b>'+(bot?'Edit bot':'New bot')+'</b><span>Identity & personality</span></div></header>'+
    '<main class="scroll"><div class="pad">'+
    '<div class="avatarEditor"><img id="avatarPreview" class="avatar" src="'+esc(avatarOf(bot))+'">'+
    '<label class="fileLabel">Choose photo<input id="avatarFile" type="file" accept="image/*"></label></div>'+
    '<div class="sectionTitle">IDENTITY</div>'+
    '<input id="botName" class="field" placeholder="Bot name" value="'+esc(bot?bot.name:'')+'">'+
    '<input id="botTitle" class="field" placeholder="Title, e.g. Coding Assistant" value="'+esc(bot?bot.title:'')+'">'+
    '<div class="sectionTitle">INSTRUCTIONS</div>'+
    '<textarea id="botInstructions" class="textarea" placeholder="What is this bot, what should it do, and what rules should it follow?">'+esc(bot?bot.instructions:'')+'</textarea>'+
    '<textarea id="botStyle" class="textarea" placeholder="Response style, personality, tone...">'+esc(bot?bot.style:'')+'</textarea>'+
    '<input id="botSkills" class="field" placeholder="Skills, comma separated" value="'+esc(bot&&Array.isArray(bot.skills)?bot.skills.join(', '):'')+'">'+
    '<p class="hint">Each bot keeps its own identity and memory. Shared workspace memory is only read from items you explicitly mark as shared.</p>'+
    '<div id="editorErr" class="error"></div>'+
    '<button id="saveBot" class="primary">Save bot</button>'+
    (bot&&!bot.isDefault?'<div style="height:10px"></div><button id="deleteBot" class="danger">Delete bot</button>':'')+
    '</div></main></div>';

  document.getElementById('back').onclick=renderHome;
  document.getElementById('avatarFile').onchange=async function(){
    const file=this.files&&this.files[0];if(!file)return;
    try{avatarData=await compressAvatar(file);document.getElementById('avatarPreview').src=avatarData}
    catch(e){document.getElementById('editorErr').textContent=e.message}
  };
  document.getElementById('saveBot').onclick=async function(){
    const err=document.getElementById('editorErr'),btn=this;
    const name=document.getElementById('botName').value.trim();
    if(!name){err.textContent='Bot name is required.';return}
    const payload={
      ...(bot?{id:bot.id}:{}),
      name:name,
      title:document.getElementById('botTitle').value.trim(),
      avatarData:avatarData||null,
      instructions:document.getElementById('botInstructions').value,
      style:document.getElementById('botStyle').value,
      skills:document.getElementById('botSkills').value.split(',').map(function(x){return x.trim()}).filter(Boolean),
      permissions:bot&&bot.permissions?bot.permissions:{}
    };
    btn.disabled=true;err.textContent='';
    try{
      await post('/bots/save',payload);
      const d=await get('/bots/list');state.bots=d.bots||[];renderHome();
    }catch(e){if(!authFail(e))err.textContent=e.message}
    finally{btn.disabled=false}
  };
  const del=document.getElementById('deleteBot');
  if(del)del.onclick=async function(){
    if(!confirm('Delete '+bot.name+'? Its private memory will also be removed.'))return;
    try{await post('/bots/delete',{id:bot.id});const d=await get('/bots/list');state.bots=d.bots||[];renderHome()}
    catch(e){if(!authFail(e))document.getElementById('editorErr').textContent=e.message}
  };
}

function renderChat(bot){
  state.currentBot=bot;
  app.innerHTML='<div class="screen">'+
    '<header class="top"><button id="back" class="backBtn">‹</button><img class="smallAvatar" src="'+esc(avatarOf(bot))+'">'+
    '<div class="topTitle"><b>'+esc(bot.name)+'</b><span id="chatStatus">'+esc(bot.title||'Ready')+'</span></div>'+
    '<button id="editBot" class="iconBtn">⋮</button></header>'+
    '<div class="chatTools"><button id="memoryBtn" class="toolChip">Memory</button><button id="sourcesBtn" class="toolChip">Sources</button><button id="newChat" class="toolChip">New chat</button></div>'+
    '<main id="messages" class="messages"></main>'+
    '<div class="composerArea">'+
      '<div id="attachMenu" class="attachMenu hide">'+
        '<button id="chooseFile" class="attachItem"><span class="attachIcon">▱</span>Choose File</button>'+
        '<button id="takePhoto" class="attachItem"><span class="attachIcon">◉</span>Take Photo</button>'+
        '<button id="attachImage" class="attachItem"><span class="attachIcon">▧</span>Attach Image</button>'+
        '<div class="attachSep"></div>'+
        '<button id="addSource" class="attachItem"><span class="attachIcon">⌁</span>Add Source</button>'+
      '</div>'+
      '<div id="pendingAttachments" class="pending"></div>'+
      '<div class="composerRow"><button id="plusAttach" class="plusBtn">＋</button><div class="composer"><textarea id="box" rows="1" placeholder="Message '+esc(bot.name)+'…"></textarea><button id="send" class="send">➤</button></div></div>'+
      '<input id="pdfInput" type="file" accept="application/pdf" class="hide">'+
      '<input id="imageInput" type="file" accept="image/*" class="hide">'+
      '<input id="cameraInput" type="file" accept="image/*" capture="environment" class="hide">'+
    '</div></div>';
  document.getElementById('back').onclick=renderHome;
  document.getElementById('editBot').onclick=function(){renderBotEditor(bot)};
  document.getElementById('memoryBtn').onclick=function(){renderMemories(bot)};
  document.getElementById('sourcesBtn').onclick=function(){renderSources(bot)};
  document.getElementById('newChat').onclick=function(){setConv(bot.id);state.pendingAttachments=[];showWelcome(bot);drawPending()};
  document.getElementById('send').onclick=sendChat;
  document.getElementById('plusAttach').onclick=function(){
    document.getElementById('attachMenu').classList.toggle('hide');
  };
  document.getElementById('chooseFile').onclick=function(){document.getElementById('attachMenu').classList.add('hide');document.getElementById('pdfInput').click()};
  document.getElementById('attachImage').onclick=function(){document.getElementById('attachMenu').classList.add('hide');document.getElementById('imageInput').click()};
  document.getElementById('takePhoto').onclick=function(){document.getElementById('attachMenu').classList.add('hide');document.getElementById('cameraInput').click()};
  document.getElementById('addSource').onclick=function(){renderSourceEditor(bot)};
  ['pdfInput','imageInput','cameraInput'].forEach(function(id){
    document.getElementById(id).onchange=async function(){
      const file=this.files&&this.files[0];this.value='';if(!file)return;
      const status=document.getElementById('chatStatus');
      try{
        if(status)status.textContent='Uploading…';
        const ref=await uploadBinary(file);
        state.pendingAttachments.push(ref);drawPending();
      }catch(e){alert(e.message)}
      finally{if(status)status.textContent=bot.title||'Ready'}
    };
  });
  drawPending();
  const box=document.getElementById('box');
  box.onkeydown=function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat()}};
  box.oninput=function(){box.style.height='auto';box.style.height=Math.min(box.scrollHeight,112)+'px'};
  loadConversation(bot);
}

function showWelcome(bot){
  const m=document.getElementById('messages');if(!m)return;
  m.innerHTML='<section class="welcome"><img class="avatar" src="'+esc(avatarOf(bot))+'"><h2>'+esc(bot.name)+'</h2>'+
    '<p>'+esc(bot.instructions?bot.instructions.slice(0,220):'Start a conversation with this bot.')+'</p></section>';
}

async function loadConversation(bot){
  const id=conv(bot.id);
  if(!id){showWelcome(bot);return}
  try{
    const d=await get('/conversations/get?id='+encodeURIComponent(id));
    drawMessages(bot,d.messages||[]);
  }catch(e){
    if(e.status===404){setConv(bot.id);showWelcome(bot);return}
    if(!authFail(e)){showWelcome(bot)}
  }
}

function drawMessages(bot,messages){
  const m=document.getElementById('messages');if(!m)return;
  m.innerHTML='';
  (messages||[]).forEach(function(x){appendBubble(bot,x.role,x.content)});
  if(!messages||!messages.length)showWelcome(bot);
}

function appendBubble(bot,role,content){
  const m=document.getElementById('messages');if(!m)return;
  const w=m.querySelector('.welcome');if(w)w.remove();
  const row=document.createElement('div');row.className='msgRow '+role;
  if(role==='assistant'){
    const im=document.createElement('img');im.src=avatarOf(bot);im.className='miniAvatar';row.appendChild(im);
  }
  const b=document.createElement('div');b.className='bubble';b.textContent=content;row.appendChild(b);m.appendChild(row);m.scrollTop=m.scrollHeight;
}

async function sendChat(){
  if(state.busy||!state.currentBot)return;
  const bot=state.currentBot,box=document.getElementById('box');
  let text=box.value.trim();
  if(!text&&!state.pendingAttachments.length)return;
  if(!text)text='Please analyze the attached file.';
  const outgoingAttachments=state.pendingAttachments.slice();
  state.pendingAttachments=[];drawPending();
  box.value='';box.style.height='auto';appendBubble(bot,'user',text);
  state.busy=true;document.getElementById('send').disabled=true;document.getElementById('chatStatus').textContent='Working…';
  const m=document.getElementById('messages'),wait=document.createElement('div');wait.className='typing';wait.textContent=bot.name+' is working…';m.appendChild(wait);m.scrollTop=m.scrollHeight;
  try{
    const d=await post('/chat',{conversationId:conv(bot.id),botId:bot.id,message:text,attachments:outgoingAttachments});
    setConv(bot.id,d.conversationId);drawMessages(bot,d.messages||[]);
  }catch(e){
    wait.remove();if(authFail(e))return;appendBubble(bot,'assistant',e.message);
  }finally{
    state.busy=false;
    const s=document.getElementById('send');if(s)s.disabled=false;
    const st=document.getElementById('chatStatus');if(st)st.textContent=bot.title||'Ready';
  }
}


async function renderSources(bot){
  const cid=conv(bot.id);
  app.innerHTML='<div class="screen"><header class="top"><button id="back" class="backBtn">‹</button><div class="topTitle"><b>Sources</b><span>'+esc(bot.name)+' + main sources</span></div><button id="addSrc" class="iconBtn">＋</button></header><main class="scroll"><div id="sourceList" class="pad"><div class="muted">Loading…</div></div></main></div>';
  document.getElementById('back').onclick=function(){renderChat(bot)};
  document.getElementById('addSrc').onclick=function(){renderSourceEditor(bot)};
  try{
    const d=await get('/sources/list'+(cid?'?conversationId='+encodeURIComponent(cid):''));
    const items=(d.sources||[]).filter(function(x){return x.scope==='main'||(cid&&x.conversationId===cid)});
    const box=document.getElementById('sourceList');
    if(!items.length){box.innerHTML='<div class="empty"><h3>No sources yet</h3><p>Add a source for this chat or make it available to every bot.</p></div>';return}
    box.innerHTML=items.map(function(src){
      const detail=src.sourceType==='url'?(src.sourceUrl||''):(src.fileName||src.content||'');
      return '<div class="card"><div class="status '+(src.scope==='main'?'completed':'queued')+'">'+(src.scope==='main'?'MAIN SOURCE':'THIS CHAT')+'</div><h3>'+esc(src.name)+'</h3><p>'+esc(String(detail).slice(0,320))+'</p><div class="meta"><span class="pill">'+esc(src.sourceType)+'</span></div><button class="secondary deleteSource" data-id="'+src.id+'">Delete</button></div>';
    }).join('');
    box.querySelectorAll('.deleteSource').forEach(function(btn){btn.onclick=async function(){
      if(!confirm('Delete this source?'))return;
      try{await post('/sources/delete',{id:Number(btn.dataset.id)});renderSources(bot)}
      catch(e){if(!authFail(e))alert(e.message)}
    }});
  }catch(e){if(!authFail(e))document.getElementById('sourceList').innerHTML='<div class="error">'+esc(e.message)+'</div>'}
}

function renderSourceEditor(bot){
  let scope='conversation',type='text',fileRef=null;
  app.innerHTML='<div class="screen"><header class="top"><button id="back" class="backBtn">‹</button><div class="topTitle"><b>Add Source</b><span>Choose where this source is used</span></div></header>'+
    '<main class="scroll"><div class="pad">'+
      '<div class="sectionTitle">SOURCE SCOPE</div>'+
      '<div id="scopeChat" class="scopeChoice on"><div class="scopeRadio"></div><div class="scopeCopy"><b>Source for this chat</b><span>Only used in this conversation</span></div></div>'+
      '<div id="scopeMain" class="scopeChoice"><div class="scopeRadio"></div><div class="scopeCopy"><b>Main source for all</b><span>Used across all chats and bot tasks</span></div></div>'+
      '<div class="sectionTitle">SOURCE TYPE</div>'+
      '<div class="sourceTypeRow"><button class="sourceTypeBtn on" data-type="text">Text</button><button class="sourceTypeBtn" data-type="url">URL</button><button class="sourceTypeBtn" data-type="file">File / Image</button></div>'+
      '<input id="sourceName" class="field" placeholder="Source name">'+
      '<div id="sourceFields"></div>'+
      '<p class="hint">When group chat is enabled, the first option becomes “Source for this group”. Main sources stay available everywhere.</p>'+
      '<div id="sourceErr" class="error"></div><button id="saveSource" class="primary">Save source</button>'+
    '</div></main></div>';

  document.getElementById('back').onclick=function(){renderChat(bot)};
  function drawScope(){
    document.getElementById('scopeChat').classList.toggle('on',scope==='conversation');
    document.getElementById('scopeMain').classList.toggle('on',scope==='main');
  }
  document.getElementById('scopeChat').onclick=function(){scope='conversation';drawScope()};
  document.getElementById('scopeMain').onclick=function(){scope='main';drawScope()};

  function drawFields(){
    document.querySelectorAll('.sourceTypeBtn').forEach(function(b){b.classList.toggle('on',b.dataset.type===type)});
    const f=document.getElementById('sourceFields');
    if(type==='text')f.innerHTML='<textarea id="sourceContent" class="textarea" style="min-height:180px" placeholder="Paste source text here"></textarea>';
    else if(type==='url')f.innerHTML='<input id="sourceUrl" class="field" placeholder="https://...">';
    else f.innerHTML='<label class="fileLabel" style="width:100%;height:50px">Choose PDF or image<input id="sourceFile" type="file" accept="application/pdf,image/*"></label><div id="sourceFileName" class="hint" style="margin-top:10px">No file selected.</div>';
    const sf=document.getElementById('sourceFile');
    if(sf)sf.onchange=async function(){
      const file=this.files&&this.files[0];if(!file)return;
      document.getElementById('sourceFileName').textContent='Uploading '+file.name+'…';
      try{
        fileRef=await uploadBinary(file);
        document.getElementById('sourceFileName').textContent=file.name;
        const n=document.getElementById('sourceName');if(n&&!n.value)n.value=file.name;
      }catch(e){fileRef=null;document.getElementById('sourceFileName').textContent=e.message}
    };
  }
  document.querySelectorAll('.sourceTypeBtn').forEach(function(b){b.onclick=function(){type=b.dataset.type;fileRef=null;drawFields()}});
  drawFields();

  document.getElementById('saveSource').onclick=async function(){
    const err=document.getElementById('sourceErr'),name=document.getElementById('sourceName').value.trim();
    if(!name){err.textContent='Source name is required.';return}
    const payload={scope:scope,conversationId:scope==='conversation'?(conv(bot.id)||null):null,botId:scope==='conversation'?bot.id:null,groupKey:null,name:name,sourceType:type};
    if(type==='text'){
      const content=document.getElementById('sourceContent').value.trim();if(!content){err.textContent='Paste source text first.';return}
      payload.content=content;
    }else if(type==='url'){
      const u=document.getElementById('sourceUrl').value.trim();if(!u){err.textContent='Enter a URL.';return}
      payload.sourceUrl=u;
    }else{
      if(!fileRef){err.textContent='Choose and upload a file first.';return}
      payload.sourceType=fileRef.contentType.indexOf('image/')===0?'image':'file';
      payload.storageFilename=fileRef.storageFilename;payload.fileName=fileRef.fileName;payload.mimeType=fileRef.contentType;
    }
    try{
      const r=await post('/sources/save',payload);
      if(scope==='conversation'&&r.conversationId)setConv(bot.id,r.conversationId);
      renderSources(bot);
    }catch(e){if(!authFail(e))err.textContent=e.message}
  };
}

async function renderMemories(bot){
  app.innerHTML='<div class="screen"><header class="top"><button id="back" class="backBtn">‹</button><div class="topTitle"><b>'+esc(bot.name)+' Memory</b><span>Private bot memory + shared workspace</span></div><button id="addMem" class="iconBtn">＋</button></header><main class="scroll"><div id="memoryList" class="pad"><div class="muted">Loading…</div></div></main></div>';
  document.getElementById('back').onclick=function(){renderChat(bot)};
  document.getElementById('addMem').onclick=function(){renderMemoryEditor(bot)};

    const d=await get('/memories/list?botId='+encodeURIComponent(bot.id));
    const box=document.getElementById('memoryList'),items=d.memories||[];

      return '<div class="card"><h3>'+esc(m.title||'Memory')+'</h3><p>'+esc(m.content)+'</p><div class="meta">'+
        '<span class="pill">'+esc(m.scope)+'</span><span class="pill">'+esc(m.kind)+'</span>'+(m.pinned?'<span class="pill">pinned</span>':'')+

    }).join('');
    box.querySelectorAll('.deleteMem').forEach(function(btn){
      btn.onclick=async function(){if(!confirm('Delete this memory?'))return;try{await post('/memories/delete',{id:Number(btn.dataset.id)});renderMemories(bot)}catch(e){if(!authFail(e))alert(e.message)}};
    });
  }catch(e){if(!authFail(e))document.getElementById('memoryList').innerHTML='<div class="error">'+esc(e.message)+'</div>'}
}

function renderMemoryEditor(bot){
  app.innerHTML='<div class="screen"><header class="top"><button id="back" class="backBtn">‹</button><div class="topTitle"><b>Add memory</b><span>'+esc(bot.name)+'</span></div></header>'+
    '<main class="scroll"><div class="pad">'+
    '<div class="sectionTitle">SCOPE</div><select id="memScope" class="select"><option value="bot">Private to '+esc(bot.name)+'</option><option value="workspace">Shared workspace</option></select>'+
    '<select id="memKind" class="select"><option value="long_term">Long-term memory</option><option value="task">Task memory</option></select>'+
    '<input id="memTitle" class="field" placeholder="Title">'+
    '<textarea id="memContent" class="textarea" style="min-height:180px" placeholder="What should be remembered?"></textarea>'+
    '<label class="switchLine"><span>Pin this memory</span><input id="memPin" type="checkbox"></label>'+
    '<p class="hint">Shared workspace memory can be read by bots during tasks. Private memory stays attached to this bot.</p>'+
    '<div id="memErr" class="error"></div><button id="saveMem" class="primary">Save memory</button>'+
    '</div></main></div>';
  document.getElementById('back').onclick=function(){renderMemories(bot)};
  document.getElementById('saveMem').onclick=async function(){
    const scope=document.getElementById('memScope').value,content=document.getElementById('memContent').value.trim();
    if(!content){document.getElementById('memErr').textContent='Memory content is required.';return}
    try{
      await post('/memories/save',{
        botId:scope==='bot'?bot.id:null,scope:scope,kind:document.getElementById('memKind').value,
        title:document.getElementById('memTitle').value.trim(),content:content,pinned:document.getElementById('memPin').checked
      });
      renderMemories(bot);
    }catch(e){if(!authFail(e))document.getElementById('memErr').textContent=e.message}
  };
}

async function renderTasks(){
  app.innerHTML='<div class="screen"><header class="top"><button id="back" class="backBtn">‹</button><div class="topTitle"><b>Tasks</b><span>Bot collaboration only when you assign it</span></div><button id="newTask" class="iconBtn">＋</button></header><main class="scroll"><div id="taskList" class="pad"><div class="muted">Loading…</div></div></main></div>';
  document.getElementById('back').onclick=renderHome;
  document.getElementById('newTask').onclick=renderTaskEditor;
  try{
    const d=await get('/tasks/list'),box=document.getElementById('taskList'),items=d.tasks||[];
    if(!items.length){box.innerHTML='<div class="empty"><h3>No tasks yet</h3><p>Create a task and choose exactly which bots should work on it.</p></div>';return}
    box.innerHTML=items.map(function(t){
      return '<div class="card taskCard" data-id="'+t.id+'"><div class="status '+esc(t.status)+'">'+esc(t.status)+'</div><h3>'+esc(t.title)+'</h3><p>'+esc(t.instruction)+'</p><div class="meta"><span class="pill">'+t.stepCount+' steps</span></div></div>';
    }).join('');
    box.querySelectorAll('.taskCard').forEach(function(card){card.onclick=function(){renderTaskDetail(Number(card.dataset.id))}});
  }catch(e){if(!authFail(e))document.getElementById('taskList').innerHTML='<div class="error">'+esc(e.message)+'</div>'}
}

function renderTaskEditor(){
  if(!state.bots.length){renderHome();return}
  state.taskDraft={title:'',instruction:'',steps:[{botId:state.bots[0].id,instruction:''}]};
  drawTaskEditor();
}

function drawTaskEditor(){
  const d=state.taskDraft;
  const options=state.bots.map(function(b){return '<option value="'+b.id+'">'+esc(b.name)+'</option>'}).join('');
  app.innerHTML='<div class="screen"><header class="top"><button id="back" class="backBtn">‹</button><div class="topTitle"><b>New task</b><span>You control every participant and step</span></div></header>'+
    '<main class="scroll"><div class="pad">'+
    '<input id="taskTitle" class="field" placeholder="Task title" value="'+esc(d.title)+'">'+
    '<textarea id="taskInstruction" class="textarea" placeholder="Overall task instruction">'+esc(d.instruction)+'</textarea>'+
    '<div class="sectionTitle">BOT STEPS</div><div id="steps">'+d.steps.map(function(s,i){
      return '<div class="taskStep"><div class="taskStepTop"><select class="select stepBot" data-i="'+i+'">'+options+'</select><button class="removeStep" data-i="'+i+'">×</button></div>'+
        '<textarea class="textarea stepInstruction" data-i="'+i+'" placeholder="What should this bot do?">'+esc(s.instruction)+'</textarea></div>';
    }).join('')+'</div>'+
    '<button id="addStep" class="secondary">＋ Add bot step</button>'+
    '<p class="hint">Bots execute only these user-defined steps. A later bot receives outputs from earlier steps, but bots cannot create their own extra collaboration.</p>'+
    '<div id="taskErr" class="error"></div><button id="createTask" class="primary">Create task</button>'+
    '</div></main></div>';
  document.getElementById('back').onclick=renderTasks;
  d.steps.forEach(function(s,i){const sel=document.querySelector('.stepBot[data-i="'+i+'"]');if(sel)sel.value=String(s.botId)});
  function sync(){
    d.title=document.getElementById('taskTitle').value;
    d.instruction=document.getElementById('taskInstruction').value;
    document.querySelectorAll('.stepBot').forEach(function(x){d.steps[Number(x.dataset.i)].botId=Number(x.value)});
    document.querySelectorAll('.stepInstruction').forEach(function(x){d.steps[Number(x.dataset.i)].instruction=x.value});
  }
  document.getElementById('addStep').onclick=function(){sync();d.steps.push({botId:state.bots[0].id,instruction:''});drawTaskEditor()};
  document.querySelectorAll('.removeStep').forEach(function(x){x.onclick=function(){sync();if(d.steps.length>1){d.steps.splice(Number(x.dataset.i),1);drawTaskEditor()}}});
  document.getElementById('createTask').onclick=async function(){
    sync();
    if(!d.title.trim()||!d.instruction.trim()||d.steps.some(function(s){return !s.instruction.trim()})){document.getElementById('taskErr').textContent='Fill the title, overall instruction, and every bot step.';return}
    try{
      const r=await post('/tasks/create',{title:d.title.trim(),instruction:d.instruction.trim(),steps:d.steps.map(function(s){return {botId:s.botId,instruction:s.instruction.trim()}})});
      renderTaskDetail(r.taskId);
    }catch(e){if(!authFail(e))document.getElementById('taskErr').textContent=e.message}
  };
}

async function renderTaskDetail(id){
  app.innerHTML='<div class="screen"><header class="top"><button id="back" class="backBtn">‹</button><div class="topTitle"><b>Task</b><span>Loading…</span></div></header><main class="scroll"><div id="taskDetail" class="pad"><div class="muted">Loading…</div></div></main></div>';
  document.getElementById('back').onclick=renderTasks;
  try{
    const d=await get('/tasks/get?id='+encodeURIComponent(id)),t=d.task,box=document.getElementById('taskDetail');
    document.querySelector('.topTitle span').textContent=t.status;
    box.innerHTML='<div class="card"><div class="status '+esc(t.status)+'">'+esc(t.status)+'</div><h3>'+esc(t.title)+'</h3><p>'+esc(t.instruction)+'</p></div>'+
      '<div class="sectionTitle">EXECUTION ORDER</div>'+
      t.steps.map(function(s){
        return '<div class="card"><div class="status '+esc(s.status)+'">STEP '+s.stepIndex+' • '+esc(s.status)+'</div><h3>'+esc(s.botName)+'</h3><p>'+esc(s.instruction)+'</p>'+
          (s.output?'<div class="output">'+esc(s.output)+'</div>':'')+(s.error?'<div class="error">'+esc(s.error)+'</div>':'')+'</div>';
      }).join('')+
      (t.status!=='running'&&t.status!=='cancelled'?'<button id="runTask" class="primary">'+(t.status==='completed'?'Run again':'Run task')+'</button>':'')+
      (t.error?'<div class="error">'+esc(t.error)+'</div>':'');
    const run=document.getElementById('runTask');
    if(run)run.onclick=async function(){
      run.disabled=true;run.textContent='Bots are working…';
      try{await post('/tasks/run',{taskId:id});renderTaskDetail(id)}
      catch(e){if(authFail(e))return;alert(e.message);renderTaskDetail(id)}
    };
  }catch(e){if(!authFail(e))document.getElementById('taskDetail').innerHTML='<div class="error">'+esc(e.message)+'</div>'}
}

token()?boot():renderAuth(false);
</script>
