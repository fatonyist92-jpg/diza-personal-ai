<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<style>
:root{--voice:0}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 28%,#292d38 0,#11131a 48%,#090a0d 100%);font-family:system-ui,-apple-system,sans-serif}
#stage{position:relative;width:100%;height:100%;display:grid;place-items:center;transition:.25s}
#avatar{position:relative;width:min(92vw,560px);height:min(78vh,820px);border-radius:34px;overflow:hidden;transform-origin:50% 80%;animation:breathe 4.8s ease-in-out infinite;box-shadow:0 30px 90px rgba(0,0,0,.45);will-change:transform,filter}
#avatar:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.07),transparent 38%,rgba(0,0,0,.27));z-index:3;pointer-events:none}
#photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 35%;background:#171a22;transform:scale(calc(1.002 + var(--voice)*.007));transition:filter .15s ease}
#glow{position:absolute;width:64%;height:17%;left:18%;bottom:3%;filter:blur(38px);background:rgba(150,180,255,.20);border-radius:50%;transition:.18s;transform:scale(calc(1 + var(--voice)*.14))}
.connecting #glow,.thinking #glow{background:rgba(190,160,255,.32)}
.listening #glow{background:rgba(126,235,204,.38)}
.speaking #glow{background:rgba(255,176,210,.34)}
.speaking #avatar{animation:breathe 3.2s ease-in-out infinite,speak .32s ease-in-out infinite alternate;filter:brightness(calc(1 + var(--voice)*.04))}
#status{position:absolute;left:18px;top:18px;padding:8px 12px;border-radius:999px;color:#fff;background:rgba(0,0,0,.36);backdrop-filter:blur(14px);font-size:13px;z-index:5}
#liveDot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#9aa0aa;margin-right:7px;vertical-align:1px}
.connected #liveDot,.listening #liveDot,.speaking #liveDot{background:#65e6bd;box-shadow:0 0 14px rgba(101,230,189,.8)}
#hint{position:absolute;bottom:16px;left:16px;right:16px;color:rgba(255,255,255,.62);font-size:12px;text-align:center;z-index:5}
@keyframes breathe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-4px) scale(1.006)}}
@keyframes speak{from{transform:translateY(-1px) rotate(-.08deg)}to{transform:translateY(calc(-2px - var(--voice)*2px)) rotate(.08deg)}}
</style>
</head>
<body>
<div id="stage" class="idle">
  <div id="glow"></div>
  <div id="avatar">
    <img id="photo" alt="Diza"/>
    <div id="status"><span id="liveDot"></span><span id="statusText">siap</span></div>
    <div id="hint">GPT Voice Realtime</div>
  </div>
</div>
<audio id="remoteAudio" autoplay playsinline></audio>
<script>
(() => {
  const stage = document.getElementById('stage');
  const statusText = document.getElementById('statusText');
  const remoteAudio = document.getElementById('remoteAudio');
  const photo = document.getElementById('photo');
  const labels = {idle:'siap',connecting:'nyambungin…',connected:'tersambung',listening:'dengerin',thinking:'mikir',speaking:'ngomong',error:'error'};

  fetch('diza_reference.b64')
    .then(r => r.text())
    .then(t => { photo.src = 'data:image/jpeg;base64,' + t.trim(); })
    .catch(() => {});

  let cfg = { backendUrl: '' };
  let pc = null;
  let dc = null;
  let localStream = null;
  let audioCtx = null;
  let analyser = null;
  let analyserData = null;
  let analyserRaf = 0;
  let connected = false;
  let userTranscriptSeen = new Set();
  let assistantTranscriptBuffer = '';

  function androidCall(name, ...args){
    try {
      if (window.DizaAndroid && typeof window.DizaAndroid[name] === 'function') {
        window.DizaAndroid[name](...args);
      }
    } catch (_) {}
  }

  function setState(s){
    stage.className = s || 'idle';
    statusText.textContent = labels[s] || s;
    androidCall('onState', s || 'idle');
  }

  function setConnected(value){
    connected = !!value;
    androidCall('onRealtimeConnected', connected);
  }

  function fail(message){
    console.error('[DizaRealtime]', message);
    setState('error');
    androidCall('onError', String(message || 'Realtime error'));
    setConnected(false);
  }

  function startRemoteLevelMeter(stream){
    stopRemoteLevelMeter();
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const src = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      analyser.smoothingTimeConstant = .72;
      src.connect(analyser);
      analyserData = new Uint8Array(analyser.frequencyBinCount);

      const loop = () => {
        if (!analyser) return;
        analyser.getByteFrequencyData(analyserData);
        let sum = 0;
        for (const v of analyserData) sum += v;
        const avg = sum / Math.max(1, analyserData.length);
        const level = Math.min(1, Math.max(0, (avg - 5) / 70));
        document.documentElement.style.setProperty('--voice', level.toFixed(3));
        if (level > .055 && connected) setState('speaking');
        analyserRaf = requestAnimationFrame(loop);
      };

      loop();
    } catch (_) {}
  }

  function stopRemoteLevelMeter(){
    if (analyserRaf) cancelAnimationFrame(analyserRaf);
    analyserRaf = 0;
    analyser = null;
    analyserData = null;
    document.documentElement.style.setProperty('--voice','0');

    if (audioCtx) {
      try { audioCtx.close(); } catch (_) {}
    }
    audioCtx = null;
  }

  function handleRealtimeEvent(evt){
    const type = evt?.type || '';

    if (type === 'session.created' || type === 'session.updated') {
      setState('listening');
      return;
    }

    if (type === 'input_audio_buffer.speech_started') {
      setState('listening');
      return;
    }

    if (type === 'input_audio_buffer.speech_stopped') {
      setState('thinking');
      return;
    }

    if (type === 'response.created') {
      setState('thinking');
      assistantTranscriptBuffer = '';
      return;
    }

    if (type === 'response.output_audio.delta' || type === 'response.audio.delta') {
      setState('speaking');
      return;
    }

    if (
      type === 'response.output_audio_transcript.delta' ||
      type === 'response.audio_transcript.delta'
    ) {
      assistantTranscriptBuffer += evt.delta || '';
      setState('speaking');
      return;
    }

    if (
      type === 'response.output_audio_transcript.done' ||
      type === 'response.audio_transcript.done'
    ) {
      const text = (evt.transcript || assistantTranscriptBuffer || '').trim();
      if (text) androidCall('onAssistantTranscript', text);
      assistantTranscriptBuffer = '';
      return;
    }

    if (type === 'conversation.item.input_audio_transcription.completed') {
      const text = (evt.transcript || '').trim();
      const key = (evt.item_id || '') + '|' + text;

      if (text && !userTranscriptSeen.has(key)) {
        userTranscriptSeen.add(key);
        androidCall('onUserTranscript', text);
      }
      return;
    }

    if (type === 'response.done') {
      if (assistantTranscriptBuffer.trim()) {
        androidCall('onAssistantTranscript', assistantTranscriptBuffer.trim());
        assistantTranscriptBuffer = '';
      }
      if (connected) setState('listening');
      return;
    }

    if (type === 'error') {
      fail(evt?.error?.message || 'OpenAI Realtime error');
    }
  }

  async function getEphemeralKey(){
    const base = String(cfg.backendUrl || '').replace(/\/+$/, '');
    const response = await fetch(base + '/token');

    if (!response.ok) {
      throw new Error((await response.text()) || ('Backend ' + response.status));
    }

    const data = await response.json();
    if (!data?.value) throw new Error('Backend tidak mengembalikan client secret.');
    return data.value;
  }

  async function start(){
    if (connected || pc) return;

    if (!cfg.backendUrl) {
      fail('Backend Realtime belum diset.');
      return;
    }

    setState('connecting');

    try {
      const ephemeralKey = await getEphemeralKey();

      localStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true
        },
        video: false
      });

      pc = new RTCPeerConnection();

      for (const track of localStream.getTracks()) {
        pc.addTrack(track, localStream);
      }

      pc.ontrack = event => {
        const stream = event.streams?.[0] || new MediaStream([event.track]);
        remoteAudio.srcObject = stream;
        remoteAudio.play().catch(() => {});
        startRemoteLevelMeter(stream);
      };

      pc.onconnectionstatechange = () => {
        if (!pc) return;

        if (pc.connectionState === 'connected') {
          setConnected(true);
          setState('listening');
        } else if (['failed','closed','disconnected'].includes(pc.connectionState)) {
          if (pc.connectionState === 'failed') fail('Koneksi WebRTC gagal.');
        }
      };

      dc = pc.createDataChannel('oai-events');
      dc.onopen = () => setState('listening');
      dc.onmessage = e => {
        try {
          handleRealtimeEvent(JSON.parse(e.data));
        } catch (_) {
          console.debug('[DizaRealtime] raw event', e.data);
        }
      };
      dc.onerror = () => fail('Data channel Realtime error.');

      const offer = await pc.createOffer({offerToReceiveAudio: true});
      await pc.setLocalDescription(offer);

      const response = await fetch(
        'https://api.openai.com/v1/realtime/calls',
        {
          method: 'POST',
          headers: {
            Authorization: 'Bearer ' + ephemeralKey,
            'Content-Type': 'application/sdp'
          },
          body: offer.sdp
        }
      );

      if (!response.ok) {
        throw new Error((await response.text()) || ('OpenAI ' + response.status));
      }

      const answerSdp = await response.text();
      await pc.setRemoteDescription({type:'answer', sdp:answerSdp});
    } catch (err) {
      await stop();
      fail(err?.message || String(err));
    }
  }

  async function stop(){
    setConnected(false);

    try { dc?.close(); } catch (_) {}
    dc = null;

    try { pc?.close(); } catch (_) {}
    pc = null;

    if (localStream) {
      localStream.getTracks().forEach(t => t.stop());
    }
    localStream = null;

    try {
      remoteAudio.pause();
      remoteAudio.srcObject = null;
    } catch (_) {}

    stopRemoteLevelMeter();
    setState('idle');
  }

  let t = 0;

  function idleLoop(){
    t += .012;
    document.getElementById('avatar').style.marginLeft =
      (Math.sin(t) * 1.25) + 'px';
    requestAnimationFrame(idleLoop);
  }

  requestAnimationFrame(idleLoop);

  window.DizaAvatar = { setState };

  window.DizaRealtime = {
    configure(next){ cfg = {...cfg, ...(next || {})}; },
    start,
    stop,
    get connected(){ return connected; }
  };
})();
</script>
</body>
</html>
