<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>AVM Technical Guide</title>
<style>
:root{--bg:#f6f8fb;--bg2:#ffffff;--card:#ffffff;--card2:#f1f5f9;--line:#dbe4ee;--text:#16202a;--muted:#647487;--cyan:#0d6f9e;--blue:#2563eb;--mint:#16866a;--amber:#9a6500;--red:#c83e4d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#fff;color:var(--text);font-family:Inter,Roboto,Arial,sans-serif}
body{min-height:100vh;background:#fff}
button,input{font:inherit}
#splash{position:fixed;z-index:99;inset:0;background:#fff;display:grid;place-items:center;transition:.65s ease}
#splash.hide{opacity:0;pointer-events:none}
.logo{width:92px;height:92px;border-radius:28px;background:linear-gradient(135deg,var(--blue),var(--cyan));display:grid;place-items:center;box-shadow:0 20px 70px #2e8bd555;animation:pop .7s cubic-bezier(.2,.9,.2,1)}
.logo svg{width:52px;height:52px;fill:#07111f}.spt{font-size:26px;font-weight:900;letter-spacing:2px;margin-top:20px}.sps{font-size:11px;color:var(--cyan);letter-spacing:2.5px;margin-top:7px}.bar{width:150px;height:4px;background:#183149;border-radius:10px;overflow:hidden;margin:30px auto 0}.bar i{display:block;width:40%;height:100%;background:var(--cyan);animation:load 1s ease-in-out infinite}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
.app{max-width:900px;margin:auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 34px)}
.top{display:flex;align-items:center;gap:12px;padding:4px 4px 14px}.miniLogo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--blue),var(--cyan));display:grid;place-items:center;box-shadow:0 10px 35px #2e8bd533}.miniLogo svg{width:25px;height:25px;fill:#07111f}.brand{flex:1}.brand b{font-size:18px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.ready{display:flex;align-items:center;gap:6px;border:1px solid #b9dfd4;background:#edf9f5;padding:7px 10px;border-radius:20px;color:var(--mint);font-size:10px;font-weight:800}.dot{width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 14px var(--mint)}
.searchWrap{position:sticky;top:0;z-index:10;background:linear-gradient(180deg,#ffffffff 70%,#ffffff00);padding:6px 0 10px}.search{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #cedae5;border-radius:20px;padding:2px 14px;box-shadow:0 10px 28px #24415a12}.search svg{width:22px;fill:var(--cyan)}.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font-size:16px;padding:15px 0}.search input::placeholder{color:#6f8297}.clear{border:0;background:#1a3047;color:var(--muted);width:30px;height:30px;border-radius:50%;display:none}
.chips{display:flex;gap:7px;overflow:auto;padding:10px 1px 4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{white-space:nowrap;border:1px solid #d5e0ea;background:#fff;color:var(--muted);padding:8px 12px;border-radius:20px;font-size:11px;font-weight:800}.chip.on{color:#075d88;border-color:#9ac8db;background:#edf8fc}
.hero{margin-top:10px;border:1px solid #dbe4ee;border-radius:24px;background:linear-gradient(145deg,#ffffff,#f5f9fc 65%);padding:20px;box-shadow:0 12px 35px #24415a14;overflow:hidden;position:relative}.hero:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-70px;top:-90px;background:#47d7ff10}.hero h1{font-size:20px;margin:0 0 9px}.hero p{font-size:12px;line-height:18px;color:var(--muted);margin:0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.stat{background:var(--card);border:1px solid #1b334c;border-radius:16px;padding:13px 5px;text-align:center}.stat b{display:block;color:var(--cyan);font-size:18px}.stat span{font-size:9px;color:var(--muted)}
.sec{font-size:13px;font-weight:900;margin:20px 2px 10px}.quick{display:grid;grid-template-columns:1fr;gap:8px}.qcard,.card{background:#fff;border:1px solid #dbe4ee;border-radius:17px;padding:14px;transition:.18s ease;box-shadow:0 5px 18px #24415a0c}.qcard:active,.card:active{transform:scale(.987);background:var(--card2)}.qcard{display:flex;align-items:center;gap:12px}.ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:#153c56;color:var(--cyan);font-weight:900}.qtxt{flex:1}.qtxt b{font-size:13px}.qtxt small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.chev{color:#60758b;font-size:20px}
.resultHead{display:flex;align-items:center;margin:10px 2px}.resultHead b{font-size:13px}.resultHead span{margin-left:auto;color:var(--cyan);font-size:11px}.results{display:grid;gap:9px}.badge{display:inline-block;border-radius:8px;padding:4px 7px;font-size:9px;font-weight:900;letter-spacing:.7px}.bComp{color:var(--cyan);background:#123a51}.bAlarm{color:var(--red);background:#4b222a}.bSpare{color:var(--amber);background:#49381b}.bDoc{color:#8cb0ff;background:#1f315b}.titleRow{display:flex;gap:8px;align-items:center}.card h3{margin:8px 0 4px;font-size:15px}.card p{margin:0;color:var(--muted);font-size:11px;line-height:16px}.empty{text-align:center;padding:60px 25px;color:var(--muted)}.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:8px}
.sheetBackdrop{position:fixed;inset:0;background:#000a;z-index:50;opacity:0;pointer-events:none;transition:.2s}.sheetBackdrop.on{opacity:1;pointer-events:auto}.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:92vh;background:#fff;border-radius:26px 26px 0 0;transform:translateY(102%);transition:.28s cubic-bezier(.22,.82,.32,1);box-shadow:0 -25px 70px #0003;overflow:auto;padding:8px 18px calc(env(safe-area-inset-bottom) + 28px)}.sheet.on{transform:none}.handle{width:42px;height:4px;background:#53667a;border-radius:5px;margin:3px auto 16px}.sheetHead{display:flex;align-items:flex-start;gap:12px}.sheetIcon{width:48px;height:48px;border-radius:15px;background:#133d55;display:grid;place-items:center;color:var(--cyan);font-size:21px}.sheetHead h2{font-size:20px;margin:2px 0 4px}.sheetHead p{margin:0;color:var(--cyan);font-size:11px}.section{margin-top:22px}.section h4{margin:0 0 9px;color:var(--cyan);font-size:13px}.box{background:var(--card);border:1px solid #20384f;border-radius:16px;padding:13px}.rows .row{display:grid;grid-template-columns:.9fr 1.2fr;gap:10px;padding:8px 0;border-bottom:1px solid #20364b}.rows .row:last-child{border-bottom:0}.rows .row span:first-child{color:var(--muted);font-size:11px}.rows .row span:last-child{font-size:11px;font-weight:700}.tags{display:flex;flex-wrap:wrap;gap:6px}.tag{background:#153c56;color:var(--cyan);border:0;border-radius:9px;padding:7px 9px;font-size:10px;font-weight:900}.source{background:var(--card);border:1px solid #20384f;border-radius:14px;padding:12px;margin-bottom:7px}.source b{font-size:12px}.source small{display:block;color:var(--muted);margin-top:4px;line-height:15px}.spare{background:var(--card);border:1px solid #263d54;border-radius:14px;padding:12px;margin-bottom:7px}.spare b{color:var(--amber)}.spare p{margin:5px 0 0;font-size:11px;color:var(--muted)}.alarmBox{background:#30202a;border:1px solid #5c2f3b;border-radius:14px;padding:12px;margin-bottom:7px}.alarmBox b{color:#ff9191}.alarmBox p{font-size:11px;color:#c7a9b1;margin:5px 0 0}.action{background:#112f32;border:1px solid #22514c;border-radius:16px;padding:14px;line-height:19px;font-size:12px}.action b{color:var(--mint)}.steps{counter-reset:s}.step{display:flex;gap:9px;margin:10px 0;color:#dce6f0;font-size:12px;line-height:18px}.step:before{counter-increment:s;content:counter(s);flex:0 0 24px;height:24px;border-radius:50%;background:#153c56;color:var(--cyan);display:grid;place-items:center;font-size:10px;font-weight:900}
.note{font-size:10px;color:#7f93a8;line-height:15px;padding:8px 2px}
mark{background:#174963;color:#7be3ff;border-radius:3px;padding:0 2px}
@media(min-width:700px){.quick{grid-template-columns:1fr 1fr}.sheet{left:50%;right:auto;width:720px;transform:translate(-50%,102%)}.sheet.on{transform:translate(-50%,0)}}
.splashStage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;opacity:1;transition:opacity .65s ease}.splashStage.second{opacity:0}.splashStage img{max-width:72vw;max-height:28vh;object-fit:contain}.created{margin-top:22px;text-align:center;color:#697889;font-size:13px;line-height:21px;letter-spacing:.3px}.created b{font-size:16px;color:#17212b}.docBtn{width:100%;text-align:left;border:1px solid #dbe4ee;background:#fff;border-radius:15px;padding:14px;margin-bottom:8px;color:#16202a}.docBtn b{display:block;font-size:13px}.docBtn small{display:block;color:#647487;margin-top:4px}.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;background:#f7fafc;border:1px solid #dbe4ee;border-radius:16px;padding:12px}.flowNode{background:#fff;border:1px solid #c9d8e4;border-radius:10px;padding:8px 10px;font-size:10px;font-weight:800}.flowArrow{color:#0d6f9e;font-weight:900}.analysisBox{background:#fff7e8;border:1px solid #efd49a;border-radius:16px;padding:14px;font-size:12px;line-height:19px}.analysisBox b{color:#875500}.verified{background:#eef8ff;border:1px solid #b9d9ec;border-radius:16px;padding:14px}.verified b{color:#075d88}</style>
</head>

<script>
const N={E:'Electrical Drawing',P:'Pneumatic & Hydraulic Drawing',M:'Main Panel Drawing',U:'Manual User'};
const PDFS={E:'Electrical Drawing.PDF',P:'Pneumatic & Hydraulic Drawing.PDF',M:'Main Panel Drawing.PDF',U:'Manual User.PDF'};
const VERIFIED_ROUTES={
 'SQ11AB':['SQ11AA BK / wire 88.6','SQ11AB BN','SQ11AB BK / wire 88.7','XTML 88.7','XTML1 88.7','XJMP pin 18','XTMP 88.7','APX0.6 input 37','CYLINDERS FOR LOCKING SIDES RETRACTED'],
 'SQ11AA':['31.5 V → BN SQ11AA','BU SQ11AA → 0 V','BK SQ11AA → wire 88.6','SQ11AB BN','lanjut melalui SQ11AB ke APX0.6 input 37']
};
function flowHtml(nodes){return '<div class="flow">'+nodes.map((n,i)=>'<span class="flowNode">'+esc(n)+'</span>'+(i<nodes.length-1?'<span class="flowArrow">→</span>':'')).join('')+'</div>'}
function routeFramework(t){let u=t.toUpperCase();if(VERIFIED_ROUTES[u])return {verified:true,nodes:VERIFIED_ROUTES[u]};if(u.startsWith('SQ'))return {verified:false,nodes:['Sensor / limit switch','Cable & connector','Terminal','PLC digital input','Interlock / sequence','Actuator feedback']};if(u.startsWith('YV'))return {verified:false,nodes:['PLC output','Relay / output stage','Coil '+u,'Valve spool / pilot','Pneumatic / hydraulic flow','Cylinder / actuator','Feedback sensor']};if(u.startsWith('BP')||u.startsWith('SP'))return {verified:false,nodes:['Pressure point',u,'Signal wiring','PLC input','Pressure logic','Valve / regulator / actuator']};if(u.startsWith('KM'))return {verified:false,nodes:['PLC / relay command',u+' coil','Main contact','Motor / load','Auxiliary feedback','PLC input']};if(u.startsWith('RP'))return {verified:false,nodes:['Pressure supply',u,'Manifold','Valve / actuator','Pressure feedback']};return {verified:false,nodes:[u,'Dokumen sumber','I/O / valve / actuator terkait','Feedback / interlock']}}
function engineeringAnalysis(a){let n=norm(a.name+' '+a.arti);let out=[];if(n.includes('TIME LIMIT'))out.push('Gerakan atau proses tidak selesai pada waktu yang diizinkan. Bedakan dulu apakah proses benar-benar lambat atau feedback akhir tidak terbaca.');if(n.includes('PRESSURE')||n.includes('BP')||n.includes('SP'))out.push('Periksa supply pressure, regulator, valve yang mengatur aliran, kebocoran/penyumbatan, lalu bandingkan tekanan nyata dengan feedback transduser/pressure switch.');if(n.includes('SQ')||n.includes('LIMIT SWITCH'))out.push('Periksa apakah posisi mekanis benar-benar mencapai sensor, alignment/gap sensor, 24 V, konektor/terminal, wire continuity, lalu status input PLC.');if(n.includes('YV')||n.includes('VALVE'))out.push('Pastikan output PLC memerintah, coil mendapat tegangan, solenoid menarik, spool/pilot bergerak, dan aliran fluida benar-benar berubah. Coil aktif tidak selalu berarti valve mekanis berpindah.');if(n.includes('ROBOT'))out.push('Pisahkan masalah posisi fisik robot dari masalah handshake I/O. Verifikasi urutan request, ready, in-position dan out-of-way.');if(n.includes('TEMPERATURE'))out.push('Bandingkan temperatur aktual dengan pembacaan sensor. Periksa cooling/heating, sirkulasi, sensor dan wiring sebelum menyimpulkan parameter salah.');if(n.includes('DISCONNECTED'))out.push('Prioritaskan supply sensor, common/0 V, kabel, connector, terminal dan channel input sebelum mengganti transduser.');if(n.includes('OVERLOAD'))out.push('Cari penyebab beban berlebih atau mekanisme macet sebelum reset proteksi. Reset berulang dapat menyembunyikan akar masalah.');if(!out.length)out.push('Urutkan diagnosis dari kondisi fisik proses → energi/supply → actuator → sensor feedback → wiring/I/O → parameter/logic. Hindari langsung mengganti komponen sebelum membuktikan titik yang gagal.');return out}
function alarmFlow(a){let tags=a.g||[];if(tags.length)return ['Kondisi proses',...tags.slice(0,3),'PLC logic / interlock','Alarm '+a.code];return ['Kondisi proses','Sensor / feedback terkait','PLC logic / interlock','Alarm '+a.code]}
function openPdf(file,page=1){if(window.Android&&Android.openPdf)Android.openPdf(file,page);else alert('PDF reader tersedia di APK Android.');}
function pdfLibrary(){show('<div class="sheetHead"><div class="sheetIcon">PDF</div><div><h2>Dokumen asli</h2><p>Baca manual & drawing secara manual</p></div></div><div class="section">'+Object.entries(PDFS).map(([k,f])=>'<button class="docBtn" onclick="openPdf(\''+f.replace(/'/g,"\\'")+'\',1)"><b>'+esc(N[k])+'</b><small>'+esc(f)+' • offline di dalam APK</small></button>').join('')+'</div>')}
window.appBack=function(){if($('#sheet').classList.contains('on'))closeSheet();if(q.value.trim()||filter!=='ALL'||$('#sheet').classList.contains('on')){q.value='';clear.style.display='none';filter='ALL';document.querySelectorAll('.chip').forEach((x,i)=>x.classList.toggle('on',i===0));home();window.scrollTo(0,0);return 'HANDLED'}return 'EXIT'};

const $=s=>document.querySelector(s), esc=s=>(s??'').toString().replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const filters=[['ALL','Semua'],['COMP','Komponen'],['ALARM','Alarm'],['SPARE','Spare Part'],['DOC','Dokumen']]; let filter='ALL';
const q=$('#q'), main=$('#main'), clear=$('#clear');
setTimeout(()=>{$('#stageSacmi').style.opacity='0';$('#stageToto').style.opacity='1'},2000);setTimeout(()=>$('#splash').classList.add('hide'),4300);
$('#chips').innerHTML=filters.map((x,i)=>`<button class="chip ${i===0?'on':''}" data-f="${x[0]}">${x[1]}</button>`).join('');
$('#chips').onclick=e=>{let b=e.target.closest('.chip');if(!b)return;filter=b.dataset.f;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));render()};
q.oninput=()=>{clear.style.display=q.value?'block':'none';render()};clear.onclick=()=>{q.value='';clear.style.display='none';q.focus();render()};
function func(tag){let t=tag.toUpperCase(); if(t.startsWith('SQ'))return'Sensor posisi / limit switch'; if(t.startsWith('YV'))return'Solenoid valve / aktuator valve';if(t.startsWith('BP'))return'Transduser tekanan';if(t.startsWith('BT'))return'Sensor temperatur';if(t.startsWith('BQ'))return'Transduser proses';if(t.startsWith('SP'))return'Pressure switch';if(t.startsWith('ST'))return'Thermostat / temperature switch';if(t.startsWith('KA'))return'Relai kontrol';if(t.startsWith('KM')||t.startsWith('KEV'))return'Kontaktor';if(t.startsWith('QF')||t.startsWith('QM'))return'Proteksi / circuit breaker / overload';if(t.startsWith('XT'))return'Terminal block';if(t.startsWith('XJ')||t.startsWith('XS'))return'Konektor / plug';if(t.startsWith('APX'))return'Modul I/O PLC';if(t.startsWith('DPX'))return'Bus / konektor komunikasi';if(t.startsWith('RP'))return'Pressure regulator';if(t.startsWith('SL'))return'Sensor / kontrol level';if(t.startsWith('SB'))return'Push button';if(t.startsWith('SA'))return'Selector switch';if(t.startsWith('FU')||t.startsWith('FA'))return'Fuse / proteksi';if(t.startsWith('HL'))return'Lampu indikator';if(t.startsWith('VB'))return'Balancing valve';return'Komponen / tag teknis AVM'}
function trPart(d,tag){let s=(d||'').toUpperCase(),m=[['MAGNETIC SWITCH','Sensor magnetik'],['PROXIMITY SWITCH','Sensor proximity'],['SWITCH','Saklar / sensor'],['CONTACTOR','Kontaktor'],['RELAY','Relai'],['GAUGE BLOCK','Blok kontak'],['INTERFERENCE SUPPRESSOR','Peredam gangguan listrik'],['ANALOG INPUT CARD','Kartu input analog'],['ANALOG OUTPUT CARD','Kartu output analog'],['DIGITAL CARD','Kartu digital I/O'],['POWER SUPPLY','Catu daya'],['TRANSFORMER','Transformator'],['CONVERTER','Konverter'],['INVERTER','Inverter'],['OVERLOAD CUTOUT','Proteksi overload motor'],['AUTOMATIC SWITCH','Circuit breaker otomatis'],['PUSH BUTTON','Tombol tekan'],['SELECTOR SWITCH','Saklar selector'],['CONNECTOR','Konektor'],['TERMINAL','Terminal'],['SOCKET','Socket'],['CABLE','Kabel'],['FUSE','Sekering'],['FILTER','Filter'],['LEVEL CONTROL','Kontrol level'],['NAME PLATE','Label identifikasi'],['BASE','Dudukan / base'],['SUPPORT','Dudukan'],['CONTACT','Kontak'],['COIL','Koil'],['PROTECTION','Pelindung'],['FASTENER','Pengunci terminal'],['NUT','Mur'],['CABLE CLAMP','Cable gland / penjepit kabel']];for(let [a,b] of m)if(s.includes(a))return b;return func(tag||'')}
function norm(s){return (s||'').toUpperCase().replace(/\s+/g,' ').trim()}
function terms(raw){let q=norm(raw),dict={TEKANAN:'PRESSURE',SUHU:'TEMPERATURE',KATUP:'VALVE',POMPA:'PUMP',VAKUM:'VACUUM',CETAKAN:'MOLD',PENGISIAN:'FILLING',DRAINASE:'DRAINAGE',DEKOMPRESI:'DECOMPRESSION',PENJEPITAN:'CLAMPING',HIDROLIK:'HYDRAULIC',PNEUMATIK:'PNEUMATIC',DARURAT:'EMERGENCY',UDARA:'AIR',KABEL:'CABLE',KONEKTOR:'CONNECTOR',RELAI:'RELAY',KONTAKTOR:'CONTACTOR',ALIRAN:'FLOW',MINYAK:'OIL'};let a=[q,...q.split(' ')];q.split(' ').forEach(w=>dict[w]&&a.push(dict[w]));return [...new Set(a.filter(Boolean))]}
function codeHit(range,q){let n=parseInt((q.match(/\d+/)||[])[0]);if(!n)return norm(range).includes(norm(q));let nums=(range.match(/\d+/g)||[]).map(Number);if(nums.length===1)return n===nums[0];if(nums.length>=2)return n>=nums[0]&&n<=nums[1];return false}
function allTags(){if(!window._tags)window._tags=[...new Set(K.pages.flatMap(p=>p.g))].sort();return window._tags}
function tagPages(t){return K.pages.filter(p=>p.g.includes(t))}
function related(t,pages=tagPages(t)){let c={};pages.forEach(p=>p.g.forEach(x=>{if(x!==t)c[x]=(c[x]||0)+1}));return Object.entries(c).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).map(x=>x[0])}
function alarmLinked(a,t){return a.g.some(r=>r===t||(r.length<=3&&t.startsWith(r)))}
function search(raw){let Q=norm(raw),ts=terms(raw),out=[];if(!Q)return out;
if(filter==='ALL'||filter==='ALARM')K.alarms.forEach(a=>{let ex=codeHit(a.code,Q),nm=norm(a.name).includes(Q),sem=ts.some(t=>t.length>2&&(norm(a.arti).includes(t)||norm(a.aksi).includes(t)));if(ex||nm||sem)out.push({k:'ALARM',key:a.code,title:a.name,sub:`${a.code} • ${a.cat} • ${a.arti}`,s:(ex?160:0)+(nm?100:0)+(sem?18:0),o:a})});
if(filter==='ALL'||filter==='COMP')allTags().forEach(t=>{let u=norm(t),ex=u===Q,pre=u.startsWith(Q),co=u.includes(Q);if(ex||pre||co){let ps=tagPages(t),sp=K.spares.filter(x=>x.tag===t);out.push({k:'COMP',key:t,title:t,sub:`${func(t)} • ${ps.length} halaman • ${sp.length} spare part`,s:ex?190:pre?110:55})}});
if(filter==='ALL'||filter==='SPARE')K.spares.forEach(s=>{let b=norm(`${s.c} ${s.tag} ${s.d} ${s.pos}`),ex=norm(s.c)===Q,tx=norm(s.tag)===Q,hit=b.includes(Q)||ts.some(t=>t.length>2&&b.includes(t));if(hit)out.push({k:'SPARE',key:s.c,title:s.c,sub:`${s.tag||'Tanpa tag'} • ${trPart(s.d,s.tag)} • ${N[s.f]} halaman ${s.p}`,s:(ex?180:0)+(tx?120:0)+35,o:s})});
if(filter==='ALL'||filter==='DOC')K.pages.forEach(p=>{let u=norm(p.x),m=ts.filter(t=>t.length>2&&u.includes(t)).length,exact=p.g.includes(Q);if(m||exact)out.push({k:'DOC',key:Q,title:`${N[p.f]} • halaman ${p.p}`,sub:p.g.length?`Tag terkait: ${p.g.slice(0,14).join(', ')}`:'Istilah ditemukan pada halaman ini.',s:m*5+(exact?50:0),o:p})});
return out.sort((a,b)=>b.s-a.s).filter((x,i,a)=>a.findIndex(y=>y.k===x.k&&y.key===x.key&&y.title===x.title)===i).slice(0,120)}
function card(h){let bc=h.k==='COMP'?'bComp':h.k==='ALARM'?'bAlarm':h.k==='SPARE'?'bSpare':'bDoc',lab=h.k==='COMP'?'KOMPONEN':h.k==='ALARM'?'ALARM':h.k==='SPARE'?'SPARE PART':'DOKUMEN';return `<div class="card" onclick='openHit(${JSON.stringify(h.k)},${JSON.stringify(h.key)},${h.o?JSON.stringify(h.o):'null'})'><span class="badge ${bc}">${lab}</span><h3>${esc(h.title)}</h3><p>${esc(h.sub)}</p></div>`}
function home(){let tags=allTags();main.innerHTML=`<div class="hero"><h1>AVM Technical Guide</h1><p>Panduan troubleshooting AVM 150: alarm, wiring, valve, pneumatic/hydraulic, spare part, I/O dan sumber PDF asli.</p></div><div class="qcard" onclick="pdfLibrary()"><div class="ic">PDF</div><div class="qtxt"><b>Baca semua manual & drawing</b><small>Electrical • Pneumatic/Hydraulic • Main Panel • User Manual</small></div><div class="chev">›</div></div><div class="stats"><div class="stat"><b>${K.pages.length}</b><span>HALAMAN</span></div><div class="stat"><b>${tags.length}</b><span>KODE/TAG</span></div><div class="stat"><b>${K.spares.length}</b><span>SPARE</span></div><div class="stat"><b>${K.alarms.length}</b><span>GRUP ALARM</span></div></div><div class="sec">Coba pencarian cepat</div><div class="quick">${quick('SQ68RA','Sensor, spare part, alarm dan semua halaman terkait','SQ')}${quick('YV121','Valve, BP121 dan alarm terkait','YV')}${quick('CHECK YV121','Nama alarm asli + tindakan Bahasa Indonesia','!')}${quick('1219','Cari langsung berdasarkan kode alarm','#')}${quick('8V802791','Cari kode spare part langsung','SP')}${quick('SQ','Tampilkan seluruh keluarga tag SQ','ALL')}</div><div class="note">Catatan: relasi jalur pada aplikasi berasal dari halaman sumber yang sama dan kedekatan tag pada ekstraksi PDF. Aplikasi tidak mengarang arah kabel bila drawing tidak dapat direkonstruksi secara pasti dari teks.</div>`}
function quick(q,d,ic){return `<div class="qcard" onclick="setQ('${q.replace(/'/g,"\\'")}')"><div class="ic">${esc(ic)}</div><div class="qtxt"><b>${esc(q)}</b><small>${esc(d)}</small></div><div class="chev">›</div></div>`}
window.setQ=x=>{q.value=x;clear.style.display='block';render();q.scrollIntoView({behavior:'smooth',block:'start'})}
function render(){let v=q.value.trim();if(v.length<2)return home();let hs=search(v);main.innerHTML=`<div class="resultHead"><b>Hasil pencarian</b><span>${hs.length} hasil</span></div><div class="results">${hs.length?hs.map(card).join(''):`<div class="empty"><b>Tidak ditemukan di dokumen</b>Coba kode lengkap, nama alarm asli, atau prefix seperti SQ / YV / BP / KA.</div>`}</div>`}
function openHit(k,key,o){if(k==='COMP')return component(key);if(k==='ALARM'){let a=o||K.alarms.find(x=>x.code===key);return alarm(a)}if(k==='SPARE'){let s=o||K.spares.find(x=>x.c===key);return spare(s)}if(k==='DOC'){let p=o;return doc(p,key)}}
function show(html){$('#sheetBody').innerHTML=html;$('#back').classList.add('on');$('#sheet').classList.add('on');$('#sheet').scrollTop=0}
function closeSheet(){$('#back').classList.remove('on');$('#sheet').classList.remove('on')}$('#back').onclick=closeSheet;
function rows(a){return `<div class="box rows">${a.map(x=>`<div class="row"><span>${esc(x[0])}</span><span>${esc(x[1])}</span></div>`).join('')}</div>`}
function tagButtons(a){return `<div class="tags">${a.map(t=>`<button class="tag" onclick="component('${t.replace(/'/g,"\\'")}')">${esc(t)}</button>`).join('')}</div>`}
function component(t){let ps=tagPages(t),sp=K.spares.filter(x=>x.tag===t),al=K.alarms.filter(a=>alarmLinked(a,t)),rel=related(t,ps);let groups=['E','P','M','U'].map(f=>[f,ps.filter(p=>p.f===f)]).filter(x=>x[1].length);show(`<div class="sheetHead"><div class="sheetIcon">⚙</div><div><h2>${esc(t)}</h2><p>${esc(func(t))}</p></div></div><div class="section"><h4>Identitas teknis</h4>${rows([['Jenis',func(t)],['Kemunculan dokumen',ps.length+' halaman'],['Spare part ditemukan',sp.length+' item'],['Alarm terkait',al.length+' grup']])}</div>${sp.length?`<div class="section"><h4>Kode spare part</h4>${sp.map(spareMini).join('')}</div>`:''}${al.length?`<div class="section"><h4>Alarm terkait</h4>${al.map(a=>`<div class="alarmBox" onclick='alarm(${JSON.stringify(a)})'><b>${esc(a.code)} • ${esc(a.name)}</b><p>${esc(a.arti)}</p></div>`).join('')}</div>`:''}<div class="section"><h4>Diagram jalur</h4>${(()=>{let r=routeFramework(t);return (r.verified?'<div class="verified"><b>Jalur tervalidasi dari drawing</b><br>Trace ini dibaca dari schematic, bukan hanya text extraction.</div><div style="height:9px"></div>':'<div class="action"><b>Kerangka jalur analisa</b><br>Urutan di bawah adalah kerangka troubleshooting. Detail terminal/card harus divalidasi dari drawing visual sebelum dianggap exact.</div><div style="height:9px"></div>')+flowHtml(r.nodes)})()}</div><div class="section"><h4>Referensi silang</h4><div class="action"><b>Relasi dokumen</b><br>Tag di bawah muncul pada halaman yang sama dengan ${esc(t)} dan dipakai sebagai petunjuk penelusuran, bukan bukti koneksi langsung.</div><div style="height:10px"></div>${tagButtons(rel.slice(0,50))}</div><div class="section"><h4>Lokasi di seluruh PDF</h4>${groups.map(([f,a])=>`<div class="source"><b>${N[f]}</b><small>Halaman PDF: ${[...new Set(a.map(x=>x.p))].sort((a,b)=>a-b).join(', ')}</small><small>Tag terdekat: ${related(t,a).slice(0,16).join(', ')||'-'}</small></div>`).join('')}</div>`)}
function spareMini(s){return `<div class="spare" onclick='spare(${JSON.stringify(s)})'><b>${esc(s.c)}</b><p>${esc(s.tag||'Tanpa tag')} • ${esc(trPart(s.d,s.tag))} • Posisi ${esc(s.pos||'-')} • ${esc(N[s.f])} h. ${s.p}</p></div>`}
function alarm(a){if(!a)return;let linked=[...new Set(a.g.flatMap(r=>r.length<=3?allTags().filter(t=>t.startsWith(r)).slice(0,25):[r]))];show(`<div class="sheetHead"><div class="sheetIcon" style="background:#4a222d;color:#ff7c86">!</div><div><h2>${esc(a.name)}</h2><p>${esc(a.code)} • ${esc(a.cat)}</p></div></div><div class="section"><h4>Arti / kondisi alarm</h4><div class="box" style="line-height:20px;font-size:12px">${esc(a.arti)}</div></div><div class="section"><h4>Dasar dari manual</h4><div class="action"><b>Instruksi sumber</b><br>${esc(a.aksi)}</div></div><div class="section"><h4>Diagram sebab → alarm</h4>${flowHtml(alarmFlow(a))}</div><div class="section"><h4>Analisa engineering Diza</h4><div class="analysisBox"><b>Potensi masalah yang perlu dibuktikan</b><br>${engineeringAnalysis(a).map(x=>'• '+esc(x)).join('<br>')}</div></div>${linked.length?`<div class="section"><h4>Komponen terkait</h4>${tagButtons(linked)}</div>`:''}<div class="section"><h4>Sumber</h4><div class="source"><b>${N[a.f]}</b><small>Halaman PDF ${a.p}. Nama alarm dan kode dipertahankan seperti dokumen asli.</small><button class="tag" style="margin-top:8px" onclick="openPdf(PDFS['${a.f}'],${a.p})">Buka PDF halaman ${a.p}</button></div></div><div class="section"><h4>Urutan pemeriksaan umum</h4><div class="steps"><div class="step">Pastikan kondisi mesin aman lalu catat kode dan nama alarm persis seperti HMI.</div><div class="step">Periksa device/tag yang disebut alarm, posisi mekanis, supply, konektor dan wiring.</div><div class="step">Bila berkaitan input PLC, manual menyebut verifikasi tegangan: 0 V = input tidak aktif, 24 V = input aktif.</div><div class="step">Hilangkan penyebab fault lebih dulu, kemudian RESET atau reposition sesuai prosedur.</div><div class="step">Jika fault berulang, telusuri Electrical, Pneumatic & Hydraulic, Main Panel dan Manual melalui tag terkait.</div></div></div>`)}
function spare(s){if(!s)return;let ps=s.tag?tagPages(s.tag):[],same=s.tag?K.spares.filter(x=>x.tag===s.tag&&x.c!==s.c):[];show(`<div class="sheetHead"><div class="sheetIcon" style="background:#4a3817;color:var(--amber)">▣</div><div><h2>${esc(s.c)}</h2><p>Spare part ${esc(s.tag||'tanpa tag')}</p></div></div><div class="section"><h4>Data katalog</h4>${rows([['Tag / sigla',s.tag||'-'],['Kode spare part',s.c],['Jenis',trPart(s.d,s.tag)],['Jumlah katalog',s.q||'-'],['Posisi drawing',s.pos||'-'],['Sumber',N[s.f]+' • halaman '+s.p]])}</div>${same.length?`<div class="section"><h4>Item lain untuk tag yang sama</h4>${same.slice(0,20).map(spareMini).join('')}</div>`:''}${s.tag?`<div class="section"><h4>Referensi komponen</h4><div class="action">${ps.length} halaman lain memuat <b>${esc(s.tag)}</b>. Tekan tag berikut untuk membuka analisa lintas dokumen.</div><div style="height:10px"></div>${tagButtons([s.tag])}</div>`:''}`)}
function doc(p,key){let rel=p.g.slice(0,60);show(`<div class="sheetHead"><div class="sheetIcon">≡</div><div><h2>${esc(N[p.f])}</h2><p>Halaman PDF ${p.p}</p></div></div><div class="section"><h4>Tag pada halaman</h4>${rel.length?tagButtons(rel):'<div class="box">Tidak ada tag terstruktur yang terbaca pada halaman ini.</div>'}</div><div class="section"><h4>Konteks sumber asli</h4><div class="box" style="font-size:11px;line-height:17px;color:var(--muted)">${esc(excerpt(p.x,key))}</div></div><div class="section"><button class="docBtn" onclick="openPdf(PDFS['${p.f}'],${p.p})"><b>Buka halaman asli</b><small>${esc(N[p.f])} • halaman ${p.p}</small></button></div>`)}
function excerpt(t,k){let u=norm(t),q=norm(k),i=u.indexOf(q);if(i<0)i=0;let a=Math.max(0,i-250),b=Math.min(t.length,i+650);return (a?'… ':'')+t.slice(a,b)+(b<t.length?' …':'')}
home();
</script>
</body></html>
