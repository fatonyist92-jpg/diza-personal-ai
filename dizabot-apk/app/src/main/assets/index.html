<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DIZAbot</title>
<style>
:root{--bg:#111;--card:#202020;--card2:#2c2c2e;--line:#38383a;--text:#f4f4f5;--sub:#929297;--dim:#5e5e62;--blue:#147cff}
*{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Roboto,Arial,sans-serif}body{overflow:hidden}button{font:inherit;color:inherit}
.page{height:100%;overflow:auto;background:var(--bg);padding-bottom:24px}.page::-webkit-scrollbar{display:none}
.circle{width:48px;height:48px;border-radius:50%;border:1px solid #4b4b4e;background:#2b2b2d;display:grid;place-items:center;font-size:30px;line-height:1;padding:0}
.circle.smalltxt{font-size:21px;color:#bcbcc0}.top{height:112px;display:flex;align-items:center;justify-content:space-between;padding:20px 22px 0;position:relative}
.brand{position:absolute;left:50%;top:12px;transform:translateX(-50%);text-align:center}.brand img{width:86px;height:86px;border-radius:50%;object-fit:cover}.brand .name{color:#9b9ba0;font-size:17px;margin-top:8px;white-space:nowrap}
.actions{display:flex;gap:10px}.anchor{position:relative}.popover{position:absolute;background:#2d2d2f;border:1px solid #55555a;border-radius:25px;z-index:20;overflow:hidden;box-shadow:0 7px 30px #0008}
.popover button{width:100%;border:0;background:none;text-align:left;padding:18px 26px;font-size:20px;white-space:nowrap}.newpop{right:0;top:60px;width:260px}
.list{margin-top:86px}.row{height:74px;width:100%;display:flex;align-items:center;border:0;background:none;padding:0 28px 0 32px;text-align:left}
.avatar{width:46px;height:46px;border-radius:50%;overflow:hidden;flex:0 0 auto;background:#323236;display:grid;place-items:center;font-size:21px;color:#ddd}.avatar img{width:100%;height:100%;object-fit:cover}
.mark{width:46px;height:46px;clip-path:polygon(25% 3%,75% 3%,98% 25%,98% 75%,75% 97%,25% 97%,2% 75%,2% 25%);position:relative}.mark:after{content:"";position:absolute;width:7px;height:14px;border-radius:10px;background:#111;top:10px;left:17px;transform:rotate(-17deg);box-shadow:14px 4px 0 #111}.green{background:#00ca6b}.red{background:#ff2245}.orange{background:#ff9800}
.rowcopy{min-width:0;margin-left:17px;flex:1}.rowtitle{font-size:20px;display:flex;align-items:center;gap:8px}.chip{font-size:14px;color:#c4c4c8;background:#2a2a2c;padding:3px 8px;border-radius:11px}.rowsub{margin-top:6px;font-size:17px;color:#929297;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{width:78px;text-align:right;color:#68686c;font-size:16px}.dot{width:11px;height:11px;background:#167cff;border-radius:50%;display:inline-block;margin-top:8px}
.closebar{padding:22px}.card{margin:24px 28px;background:var(--card);border-radius:24px;overflow:hidden}.settings .card{margin-top:18px}.setline{width:100%;min-height:78px;border:0;background:none;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;text-align:left;border-bottom:1px solid var(--line)}.setline:last-child{border-bottom:0}
.settitle{font-size:20px}.setsub{font-size:16px;color:#99999e;margin-top:4px;line-height:1.35}.setright{display:flex;align-items:center;color:#9a9a9f;font-size:20px;gap:7px}.sectionlabel{margin:0 32px 8px;color:#5f5f63;font-size:17px}.accountline{display:flex;gap:15px;align-items:center}.accounta{width:45px;height:45px;border-radius:50%;background:#3a3a3e;display:grid;place-items:center;color:#b0b0b6;font-size:20px}
.switch{width:52px;height:32px;border:0;border-radius:18px;padding:3px;background:#fff}.switch i{display:block;width:26px;height:26px;border-radius:50%;background:#141414;margin-left:20px}.switch.off{background:#606064}.switch.off i{margin-left:0;background:#222}
.floatbar{height:76px;display:flex;align-items:center;justify-content:space-between;padding:12px 22px;position:sticky;top:0;z-index:10;background:linear-gradient(#111 76%,transparent)}
.pill{height:48px;padding:0 18px;border:1px solid #55555a;border-radius:25px;background:#2b2b2d;display:flex;align-items:center;gap:8px;font-size:20px}.pill img{width:30px;height:30px;border-radius:50%;object-fit:cover}.chatpage{overflow:hidden}.messages{height:calc(100% - 148px);overflow:auto;padding:0 30px 130px}.messages::-webkit-scrollbar{display:none}
.msg{max-width:82%;background:#232323;border-radius:20px;padding:14px 16px;margin:12px 0;font-size:19px;line-height:1.35}.user{margin-left:auto;background:#68686a}.date{text-align:center;color:#66666a;margin:18px 0 6px}
.composerbar{height:94px;position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,#111 25%);display:flex;align-items:end;gap:10px;padding:20px 22px}.composer{height:50px;border:1px solid #55555a;border-radius:27px;background:#2b2b2d;flex:1;color:#6f6f74;display:flex;align-items:center;padding:0 18px;font-size:18px}.composer .mic{margin-left:auto;color:#aaa}.wave{width:45px;height:45px;border-radius:50%;background:white;color:#111;display:grid;place-items:center;margin-left:9px}
.attachpop{left:32px;bottom:76px;width:230px;border-radius:22px}.attachpop button{padding:17px 22px;font-size:19px}.scroll{position:absolute;right:30px;bottom:98px;width:43px;height:43px;border-radius:50%;border:1px solid #55555a;background:#2b2b2d}
.sender{font-size:14px;color:#94949a;margin:0 0 -7px 14px}.grow{display:flex;gap:10px;align-items:flex-start}.grow .mini{width:25px;height:25px;border-radius:50%;margin-top:42px;object-fit:cover}.grow .msg{max-width:87%}
.grouphead{padding-top:20px}.bigstack{height:150px;position:relative;margin-top:2px}.bigstack img{width:58px;height:58px;border-radius:50%;object-fit:cover;position:absolute;border:2px solid #111}.bigstack img:nth-child(1){left:calc(50% - 62px);top:14px}.bigstack img:nth-child(2){left:50%;top:14px}.bigstack img:nth-child(3){left:calc(50% - 62px);top:68px}.bigstack span{position:absolute;left:calc(50% + 8px);top:74px;font-size:42px;color:#5e5e62}
.groupname{margin:0 28px 34px;background:#202020;border-radius:24px;text-align:center;font-size:27px;padding:24px}.member{height:62px;width:100%;border:0;background:none;display:flex;align-items:center;gap:15px;padding:0 20px;border-bottom:1px solid var(--line);font-size:19px}.member:last-child{border-bottom:0}.member img{width:30px;height:30px;border-radius:50%;object-fit:cover}.chev{margin-left:auto;color:#8d8d91}.note,.label{margin:12px 34px;color:#616165;font-size:16px}.routine{height:132px;padding:24px 20px}.addroutine{margin-top:18px;color:#277dff;font-size:19px}
.profiletop{height:76px;display:flex;justify-content:space-between;align-items:center;padding:14px 22px}.profilephoto{text-align:center;position:relative;padding:12px 0 84px}.profilephoto>button{border:0;background:none;padding:0}.profilephoto img{width:104px;height:104px;border-radius:50%;object-fit:cover}.photopop{left:50%;transform:translateX(-5%);top:115px;width:250px;border-radius:23px}.photopop .danger{color:#ff8d99}.profile .sectionlabel{margin-top:10px}.char{padding:26px 28px}.shapegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:23px 28px}.shape{height:38px;background:#8a4dff;border:0}.s1{border-radius:50%}.s2{border-radius:50%/40%}.s3{border-radius:10px}.s4{border-radius:23px}.s5{clip-path:polygon(50% 0,100% 100%,0 100%)}.s6{clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%)}.s7{border-radius:50% 50% 35% 35%}.s8{border-radius:50% 50% 50% 10%;transform:rotate(45deg);outline:3px solid #55555a;outline-offset:7px}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:20px;margin-top:32px}.sw{width:32px;height:32px;border:0;border-radius:50%;margin:auto}.selected{outline:3px solid #55555a;outline-offset:6px}.reset{width:100%;text-align:left;color:#277dff;border:0;border-top:1px solid var(--line);background:none;margin-top:28px;padding:20px 0 0;font-size:19px}
.prof-note{margin:8px 32px 28px;color:#5d5d61}.instr{height:70px;display:flex;align-items:center;padding:0 20px;font-size:19px}.hidden{display:none}
@media(min-width:520px){#app{max-width:430px;margin:auto;border-left:1px solid #222;border-right:1px solid #222}}
</style></head><body>
<div id="app"></div>
<input id="pick" class="hidden" type="file"><input id="photo" class="hidden" type="file" accept="image/*" capture="environment"><input id="image" class="hidden" type="file" accept="image/*">
<script>
let DIZA_SRC="";
fetch("diza_reference.b64").then(r=>r.text()).then(b=>{DIZA_SRC="data:image/jpeg;base64,"+b.trim();document.querySelectorAll("[data-diza]").forEach(x=>x.src=DIZA_SRC)}).catch(()=>{});
const S={screen:"home",newMenu:false,attach:false,photoMenu:true,autoReview:true,autoZone:true,notif:true};
const members=["Agista","Nindy Tan","Diza","Anggita","Laura","Nabilla"];
const diza=()=>'<div class="avatar"><img data-diza src="'+DIZA_SRC+'"></div>';
const colorAvatar=(name,c)=>'<div class="avatar" style="background:'+c+'">'+name[0]+'</div>';
const mark=c=>'<div class="mark '+c+'"></div>';
function circle(txt,act){return '<button class="circle '+(txt==="A"?"smalltxt":"")+'" '+(act?'data-act="'+act+'"':'')+'>'+txt+'</button>'}
function home(){
const rows=[
["diza",diza(),"Diza","APK 0.4.4 udah di WA Message yourself…","12:14",false,"Diza"],
["surya",colorAvatar("T","#36363a"),"Tim Surya Toto","Mantap @Sari — 10 item mekanik diteri…","Tuesday",false,""],
["agista",colorAvatar("A","#2f2f33"),"Agista","GitHub token (PAT)","Tuesday",false,""],
["wulan",mark("green"),"Wulan","Mesin mana yang mau kita mulai dulu?","Tuesday",false,""],
["devi",mark("red"),"Devi","Mau mulai dari mana?","Tuesday",true,""],
["sari",mark("orange"),"Sari","Hai Fatony. Aku siap bantu baca dra…","Tuesday",true,""],
["pa",colorAvatar("P","#313135"),"Tim PA Android","Sip @Nabilla — standby oke. Fatony mi…","Tuesday",false,""],
["nabilla",colorAvatar("N","#4a352e"),"Nabilla","Standby tes Fatony.","Tuesday",false,""]
];
return '<div class="page"><div class="top">'+circle("A","settings")+'<div class="brand"><img data-diza src="'+DIZA_SRC+'"><div class="name">DIZA Bot</div></div><div class="actions">'+circle("⌕")+'<div class="anchor">'+circle("+","new")+(S.newMenu?'<div class="popover newpop"><button>New Bot</button><button>New Group Chat</button></div>':'')+'</div></div></div><div class="list">'+rows.map(r=>'<button class="row" data-row="'+r[0]+'">'+r[1]+'<div class="rowcopy"><div class="rowtitle">'+r[2]+(r[6]?'<span class="chip">'+r[6]+'</span>':'')+'</div><div class="rowsub">'+r[3]+'</div></div><div class="meta">'+r[4]+(r[5]?'<br><i class="dot"></i>':'')+'</div></button>').join("")+'</div></div>'}
function sw(on,key){return '<button class="switch '+(on?'':'off')+'" data-toggle="'+key+'"><i></i></button>'}
function line(a,b){return '<div class="setline"><div>'+a+'</div><div class="setright">'+(b||'›')+'</div></div>'}
function settings(){return '<div class="page settings"><div class="closebar">'+circle("×","home")+'</div><div class="card">'+line('<div class="accountline"><div class="accounta">A</div><div><div class="settitle">aditya</div><div class="setsub">fatonyist.92@gmail.com</div></div></div>')+line('<div class="settitle">Usage</div>','100% ›')+'</div><div class="card">'+line('<div class="settitle">Plugins</div><div class="setsub">Tools and skills for DIZA Bot</div>')+'</div><div class="sectionlabel">Bot</div><div class="card">'+line('<div class="settitle">Auto-review</div><div class="setsub">Require approval for risky shell, MCP,<br>and computer actions.</div>',sw(S.autoReview,"autoReview"))+line('<div class="settitle">Auto-review Rules</div>','None ›')+line('<div class="settitle">Set Time Zone Automatically</div><div class="setsub">Your Bot\'s computer follows this<br>device\'s time zone.</div>',sw(S.autoZone,"autoZone"))+line('<div class="settitle">Time Zone</div>','Asia/Jakarta')+line('<div class="settitle">Bot Computer</div>')+'</div><div class="card">'+line('<div class="settitle">Notifications</div>',sw(S.notif,"notif"))+'</div></div>'}
function top(title,act){return '<div class="floatbar">'+circle("‹","home")+'<button class="pill" data-act="'+act+'"><img data-diza src="'+DIZA_SRC+'"><span>'+title+'</span></button>'+circle("▣")+'</div>'}
function chat(){return '<div class="page chatpage">'+top("Diza","profile")+'<div class="messages"><div class="msg">Jadi jalannya: Online = share ke<br>Message yourself (watcher Tim<br>dan reply lokal tetap di app.<br><br>Gue build 0.4.4 sekarang, nanti<br>dikirim ke WA.</div><div class="msg">APK 0.4.4 siap (~17 MB). Online =<br>jawaban Lokal + share ke WhatsApp<br>(Message yourself). Gue kirim ke<br>WA sekarang.</div><div class="msg">Cara pakai setelah install: mode<br>Online → ketik pertanyaan →<br>dapat jawaban Lokal → pilih<br>chat Message yourself di share<br>WA. Watcher + Tim yang bedah<br>online-nya.</div><div class="msg">APK 0.4.4 udah di WA Message<br>yourself (blue checks). Install, terus<br>coba Online → share ke Message<br>yourself.</div><div class="date">Tuesday 14:50</div><div class="msg user">Penjelasan or deskripsi rubah ke<br>bahasa Indonesia. Klo alarm sama<br>kode jangan</div><div class="msg user">Penjelasan or deskripsi rubah ke<br>bahasa Indonesia. Klo alarm sama</div></div><button class="scroll">⌄</button><div class="composerbar">'+(S.attach?'<div class="popover attachpop"><button data-file="pick">▭ &nbsp; Choose File</button><button data-file="photo">▣ &nbsp; Take Photo</button><button data-file="image">▧ &nbsp; Attach Image</button></div>':'')+circle("+","attach")+'<div class="composer">Ask Diza <span class="mic">♩</span><span class="wave">▥</span></div></div></div>'}
function groupChat(){const msgs=[["Nabilla","Sip @Agista — lagi gue gas: bar<br>bawah balik, ChatGPT diam.<br>Habis jadi gue lempar APK ke lu."],["Agista","Sip @Nabilla — gas. Habis jadi<br>lempar path APK ke gue, gue<br>terusin Fatony. Yang lain diam<br>dulu."],["Nabilla","Sip @Agista — gue standby<br>nunggu cerita tes Fatony."],["Agista","Sip @Nabilla — standby oke.<br>Fatony minta link download<br>(bukan file nempel); gue lagi<br>urus itu. Tes belum masuk cerita<br>baru."]];return '<div class="page chatpage"><div class="floatbar">'+circle("‹","home")+'<button class="pill" data-act="groupInfo"><span>◉ ◉ ◉ +3</span><span>Tim PA Android</span></button>'+circle("▣")+'</div><div class="messages">'+msgs.map((m,i)=>'<div class="grow"><img data-diza class="mini" src="'+DIZA_SRC+'"><div><div class="sender">'+m[0]+'</div><div class="msg">'+m[1]+'</div>'+(i===1?'<div class="msg">Update: APK 0.5.4-bar (~22<br>MB) udah gue kirim Fatony. Bar<br>bawah lengkap, ChatGPT OFF.<br>Nunggu hasil tes — yang lain<br>diam dulu.</div>':'')+'</div></div>').join("")+'</div><div class="composerbar">'+circle("+")+'<div class="composer">Message Tim PA Android <span class="mic">♩</span></div></div></div>'}
function groupInfo(){return '<div class="page"><div class="profiletop">'+circle("‹","groupChat")+circle("⋯")+'</div><div class="bigstack"><img data-diza src="'+DIZA_SRC+'"><img data-diza src="'+DIZA_SRC+'"><img data-diza src="'+DIZA_SRC+'"><span>+3</span></div><div class="groupname">Tim PA Android</div><div class="card">'+members.map(n=>'<div class="member"><img data-diza src="'+DIZA_SRC+'"><span>'+n+'</span><span class="chev">›</span></div>').join("")+'</div><div class="note">Group Chats can have up to 6 members.</div><div class="label">Routines</div><div class="card routine"><div style="color:#666">No routines yet</div><div class="addroutine">＋ Add routine</div></div></div>'}
function profile(){let colors=["#fff","#a8703f","#ff1935","#ff6c00","#ff9800","#00c86b","#0bc5b6","#168ef5","#8a4cff","#ff2094","#888"];return '<div class="page profile"><div class="profiletop">'+circle("‹","chat")+'<div class="actions">'+circle("⇧")+circle("⋯")+'</div></div><div class="profilephoto"><button data-act="photo"><img data-diza src="'+DIZA_SRC+'"></button>'+(S.photoMenu?'<div class="popover photopop"><button data-file="image">▧ &nbsp; Select from Gallery</button><button>✧ &nbsp; Generate</button><button class="danger">♲ &nbsp; Remove Photo</button></div>':'')+'</div><div class="sectionlabel">Character</div><div class="card char"><div class="shapegrid">'+[1,2,3,4,5,6,7,8].map(i=>'<button class="shape s'+i+'"></button>').join("")+'</div><div class="swatches">'+colors.map((c,i)=>'<button class="sw '+(i===8?'selected':'')+'" style="background:'+c+'"></button>').join("")+'</div><button class="reset">Reset to default</button></div><div class="prof-note">How this Bot\'s mark looks everywhere</div><div class="card instr">▤ &nbsp; Instructions <span class="chev">›</span></div><div class="sectionlabel">Routines</div><div class="card" style="height:75px"></div></div>'}
function render(){const f={home,settings,chat,groupChat,groupInfo,profile}[S.screen]||home;document.getElementById("app").innerHTML=f();if(DIZA_SRC)document.querySelectorAll("[data-diza]").forEach(x=>x.src=DIZA_SRC);bind()}
function bind(){document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{let a=b.dataset.act;if(a==="new")S.newMenu=!S.newMenu;else if(a==="attach")S.attach=!S.attach;else if(a==="photo")S.photoMenu=!S.photoMenu;else S.screen=a;render()});document.querySelectorAll("[data-row]").forEach(b=>b.onclick=()=>{if(b.dataset.row==="diza")S.screen="chat";if(b.dataset.row==="pa")S.screen="groupChat";render()});document.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=e=>{e.stopPropagation();S[b.dataset.toggle]=!S[b.dataset.toggle];render()});document.querySelectorAll("[data-file]").forEach(b=>b.onclick=()=>document.getElementById(b.dataset.file).click())}
render();

const PROVIDERS=[
["groq",10],["gemini",20],["cerebras",30],["zai",40],["cloudflare",50],
["openrouter",60],["mistral",70],["cohere",80],["nvidia",90],["ibm",100],
["alibaba",110],["awan",120],["kilo",130],["vercel",140],["huggingface",150],["local",999]
].map(x=>({id:x[0],priority:x[1],free:true,local:x[0]==="local"}));
const CK="dizabot_core_v03";let C={hardRp0Lock:true,reserveRatio:.10,status:{},quota:{},queue:[],lastAuditDay:null,lastDiscoveryAt:0};
try{Object.assign(C,JSON.parse(localStorage.getItem(CK)||"{}"))}catch(e){}
const save=()=>localStorage.setItem(CK,JSON.stringify(C));
const day=()=>new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Jakarta",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
function route(){for(const p of PROVIDERS.sort((a,b)=>a.priority-b.priority)){let s=C.status[p.id]||{},q=C.quota[p.id]||{};let remain=q.limit?Math.max(0,(q.limit-(q.used||0))/q.limit):1;if((p.local||s.configured===true)&&s.healthy!==false&&s.paid!==true&&remain>C.reserveRatio)return p}return PROVIDERS.find(p=>p.local)}
function canSpend(id,cost=0){if(C.hardRp0Lock&&cost>0)return false;let q=C.quota[id];return !q||!q.limit||((q.limit-(q.used||0))/q.limit)>C.reserveRatio}
function enqueue(type,payload={},id=type+":"+Date.now()){if(C.queue.some(t=>t.id===id))return;let t={id,type,payload,status:"queued",attempt:0,nextRunAt:Date.now()};C.queue.push(t);save();try{DizaNative.enqueueTask(JSON.stringify(t))}catch(e){}}
function maintenance(){let d=day();if(C.quotaDay!==d){C.quotaDay=d;Object.values(C.quota).forEach(q=>{if(q.period==="daily")q.used=0})}if(C.lastAuditDay!==d){enqueue("provider-free-tier-audit",{timezone:"Asia/Jakarta"},"audit:"+d);C.lastAuditDay=d}if(Date.now()-Number(C.lastDiscoveryAt||0)>=172800000){enqueue("provider-discovery",{scope:"new-free-providers"},"discovery:"+d);C.lastDiscoveryAt=Date.now()}save()}
window.DizaBloksCore={architecture:["agent-core","provider-router","memory","skills","tools","permissions","workflow"],providers:PROVIDERS,router:{select:route},quota:{canSpend},tasks:{enqueue},state:()=>C};
maintenance();setInterval(maintenance,3600000);
</script></body></html>
